<title>FTM Desk 737</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header + tab strip, one column of operational cards; state shown by side stripes and pills */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#13203A; --muted:#5D6A80; --line:#DCE2EB;
  --accent:#1E58B4; --accent-soft:#E3ECFA;
  --crit:#C42B2B; --crit-soft:#FBE7E6; --warn:#B26A00; --warn-soft:#FDF1DC; --ok:#1E7A46; --ok-soft:#E2F3E8;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1420; --surface:#162032; --ink:#E6ECF5; --muted:#93A1B8; --line:#26324A;
  --accent:#7FA9F0; --accent-soft:#1C2B47;
  --crit:#F07A72; --crit-soft:#3A1D20; --warn:#F0B65A; --warn-soft:#352A16; --ok:#6BCB8E; --ok-soft:#173022; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1420; --surface:#162032; --ink:#E6ECF5; --muted:#93A1B8; --line:#26324A;
  --accent:#7FA9F0; --accent-soft:#1C2B47;
  --crit:#F07A72; --crit-soft:#3A1D20; --warn:#F0B65A; --warn-soft:#352A16; --ok:#6BCB8E; --ok-soft:#173022; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:12px 6px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:1.5rem;letter-spacing:.01em;margin:0}
h1 small{font-weight:500;color:var(--muted);font-size:.95rem;margin-left:6px}
.date{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);font:600 .95rem var(--display);letter-spacing:.03em;text-transform:uppercase;padding:7px 12px;border-radius:8px;cursor:pointer}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
nav .n{font-family:var(--mono);font-size:.72rem;margin-left:4px;padding:1px 5px;border-radius:6px;background:var(--crit);color:var(--surface)}
main{padding-block:16px 48px;display:grid;gap:18px}
h2{font-family:var(--display);font-weight:600;font-size:1.05rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 0 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.kpi b{display:block;font-family:var(--display);font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:.85rem;color:var(--muted)}
.kpi.crit b{color:var(--crit)} .kpi.warn b{color:var(--warn)} .kpi.ok b{color:var(--ok)}
.list{display:grid;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.item.crit{border-left-color:var(--crit)} .item.warn{border-left-color:var(--warn)} .item.info{border-left-color:var(--accent)} .item.ok{border-left-color:var(--ok)}
.item .txt{flex:1;min-width:0}
.item .sub{color:var(--muted);font-size:.85rem}
.pill{display:inline-block;font:600 .72rem var(--body);letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:999px;white-space:nowrap}
.pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.info{background:var(--accent-soft);color:var(--accent)} .pill.mute{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px}
.card.crit{border-left:4px solid var(--crit)} .card.warn{border-left:4px solid var(--warn)} .card.done{opacity:.7}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.name{font-weight:700;font-size:1.02rem}
.mono{font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.82rem;padding:3px 9px;border-radius:6px;border:1px solid var(--line);background:var(--bg)}
.chip.free{border-color:var(--ok);color:var(--ok);background:var(--ok-soft);cursor:pointer}
.chip.free.sug{box-shadow:inset 0 0 0 1px var(--ok);font-weight:700}
.chip.no{text-decoration:line-through;color:var(--muted)}
.chip.pend{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.big{font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.prog{display:grid;gap:6px}
.prog .p{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem;padding:6px 8px;border-radius:6px;background:var(--bg)}
button.b{font:600 .85rem var(--body);border-radius:7px;padding:6px 11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.b.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
button.b.okb{border-color:var(--ok);color:var(--ok)}
button.b.sm{padding:3px 8px;font-size:.78rem}
button:focus-visible,select:focus-visible,input:focus-visible,.kpi:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=text],input[type=date],input[type=search]{font:inherit;font-size:.92rem;padding:6px 8px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
input[type=search]{width:100%}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px;border-radius:8px;background:var(--accent-soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);font:600 .85rem var(--body);padding:6px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.day{display:grid;gap:6px}
.dayh{font-family:var(--display);font-weight:600;font-size:1rem;display:flex;gap:8px;align-items:baseline}
.dayh.today{color:var(--accent)}
.slot{display:grid;grid-template-columns:62px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:8px 10px}
.slot.empty{border-left-color:var(--crit)} .slot.mine{border-left-color:var(--accent);background:var(--accent-soft)}
.slot .t{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.slot .t b{display:block;color:var(--ink);font-weight:500}
.slot .w{min-width:0}
.slot .ins{font-weight:700}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:600 .75rem var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.note{font-size:.82rem;color:var(--muted)}
.empty-state{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:24px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.grid2>*{min-width:0}
@media (prefers-reduced-motion:no-preference){.item,.card{transition:opacity .2s}}
</style>

<header>
  <div class="wrap">
    <div class="top">
      <h1>FTM Desk<small>B737 NG/MAX</small></h1>
      <span class="date" id="today"></span>
    </div>
    <nav id="tabs" aria-label="Sections">
      <button data-t="today">Aujourd'hui</button>
      <button data-t="evals">Évals OPL</button>
      <button data-t="vols">Vols instr.</button>
      <button data-t="simu">Simu</button>
      <button data-t="licences">Licences</button>
      <button data-t="equipes">Équipes</button>
    </nav>
  </div>
</header>
<main class="wrap" id="view">
  <div class="empty-state">Chargement de tes données FTM : OPL en évaluation, planning simu, licences, équipes…</div>
</main>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const ME = "BOUCHENAFA";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const TODAY_ISO = iso(TODAY);
const addDays = (s,n) => { const d = new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return iso(d); };
const frDate = s => { if(!s) return ""; const [y,m,d] = s.split("-"); return d+"/"+m+"/"+y; };
const frToIso = s => { const m = /^(\d\d)\/(\d\d)\/(\d{4})$/.exec(s||""); return m ? m[3]+"-"+m[2]+"-"+m[1] : ""; };
const JOURS = ["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
const MOIS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const dayLabel = s => { const d = new Date(s+"T00:00:00"); return JOURS[d.getDay()]+" "+d.getDate()+" "+MOIS[d.getMonth()]; };
$("#today").textContent = dayLabel(TODAY_ISO) + " " + TODAY.getFullYear();

const st = { opl:{}, ref:{}, simu:{}, taches:{}, vols:{}, loaded:{opl:false,ref:false,simu:false,taches:false,vols:false}, db:null, canWrite:true };
const ui = { tab:"today", simuMonth:null, simuFilter:"all", showPipeline:false, form:{}, licQ:"", eqQ:"", licFilter:"todo", volF:"all", volQ:"", volOpen:{} };
try { const t = localStorage.getItem("ftm.tab"); if (t) ui.tab = t; } catch(e) {}
const hashTab = (location.hash||"").slice(1);
if (["today","evals","vols","simu","licences","equipes"].includes(hashTab)) ui.tab = hashTab;

function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(()=>t.hidden = true, 2600); }

async function write(path, data, okMsg){
  if (!st.db) { toast("Base de données indisponible : la modification n'est pas enregistrée."); return; }
  try { await st.db.doc(path).update(data); if (okMsg) toast(okMsg); }
  catch(e){ toast(e && e.code === "invalid_argument" ? "Tu n'as pas les droits pour modifier ce tableau." : "Échec de l'enregistrement, réessaie."); }
}

/* ---------- derived data ---------- */
const TRI = () => (st.ref.tri && st.ref.tri.evaluateurs) || [];
const oplList = () => Object.values(st.opl).sort((a,b)=>(a.ordre||0)-(b.ordre||0));
const pending = o => (o.programmes||[]).filter(p=>p.statut==="programmé");
const aPlanifier = o => Math.max(0,(o.evalsRestantes||0) - pending(o).length);
const inEval = o => typeof o.evalsRestantes === "number";
function triLoad(){
  const L = {}; TRI().forEach(t=>L[t]=0);
  oplList().forEach(o=>pending(o).forEach(p=>{ L[p.tri]=(L[p.tri]||0)+1; }));
  return L;
}
function triDispo(o){
  const no = new Set([...(o.exclus||[]), ...pending(o).map(p=>p.tri)].map(s=>s.toLowerCase()));
  const L = triLoad();
  return TRI().filter(t=>!no.has(t.toLowerCase())).sort((a,b)=>(L[a]-L[b]) || a.localeCompare(b));
}
function oplLevel(o){
  if (!inEval(o)) return "";
  if ((o.evalsRestantes||0) === 0) return "done";
  if (aPlanifier(o) === 0) return "";
  if (o.echeance && o.echeance < TODAY_ISO) return "crit";
  if (o.echeance && o.echeance <= addDays(TODAY_ISO,7)) return "warn";
  return "";
}
function allSlots(){
  const out = [];
  Object.values(st.simu).forEach(m => (m.jours||[]).forEach((j,ji) => (j.slots||[]).forEach((s,si) => out.push({mois:m.mois, ji, si, date:j.date, ...s}))));
  return out.sort((a,b)=> a.date.localeCompare(b.date) || a.s-b.s);
}
const isMine = s => (s.instr||"").toUpperCase().includes(ME);
const isEmptySlot = s => !String(s.instr||"").replace(/^(TRI|TRE)\s*[:;]?\s*$/i,"").trim() && (s.crew||"").trim();
function licStatus(r){
  if (r.fait) return {k:"ok", t:"Renouvelée"};
  if (!r.validite) return {k:"warn", t:"Date manquante"};
  const d = frToIso(r.validite);
  if (d < TODAY_ISO) return {k:"crit", t:"Échue"};
  if (d <= addDays(TODAY_ISO,30)) return {k:"warn", t:"< 30 j"};
  return {k:"ok", t:"Valide"};
}
const lics = () => (st.ref.licences && st.ref.licences.rows) || [];
const taches = () => Object.entries(st.taches).map(([id,t])=>({id,...t}));

function alerts(){
  const A = [];
  oplList().forEach(o=>{
    const lv = oplLevel(o), n = aPlanifier(o);
    if (lv==="crit") A.push({k:"crit", tab:"evals", t:`${o.nom} : ${n} vol${n>1?"s":""} d'éval à programmer`, s:`Échéance ${frDate(o.echeance)} dépassée`});
    else if (lv==="warn") A.push({k:"warn", tab:"evals", t:`${o.nom} : ${n} vol${n>1?"s":""} d'éval à programmer`, s:`Échéance ${frDate(o.echeance)}`});
    pending(o).forEach(p=>{ if (p.date && p.date < TODAY_ISO) A.push({k:"warn", tab:"evals", t:`${o.nom} : éval avec ${p.tri} du ${frDate(p.date)}`, s:"Date passée : marque-la faite ou reprogramme"}); });
    ["checkLocal","checkNav"].forEach(f=>{
      const m = /Prévu le (\d\d)\/(\d\d)/.exec(o[f]||"");
      if (m && "2026-"+m[2]+"-"+m[1] < TODAY_ISO) A.push({k:"warn", tab:"evals", t:`${o.nom} : ${f==="checkLocal"?"check local":"check nav"} ${o[f].toLowerCase()}`, s:"Résultat à mettre à jour"});
    });
  });
  const horizon = addDays(TODAY_ISO,14);
  allSlots().filter(s=>s.date>=TODAY_ISO && s.date<=horizon && isEmptySlot(s)).forEach(s=>
    A.push({k: s.date<=addDays(TODAY_ISO,3)?"crit":"warn", tab:"simu", t:`Simu ${dayLabel(s.date)} S${s.s} : TRI à trouver`, s:s.crew}));
  const nl = lics().filter(r=>licStatus(r).k==="crit").length;
  if (nl) A.push({k:"warn", tab:"licences", t:`${nl} licences échues à faire renouveler`, s:"Selon l'état de suivi du 30/08/2026"});
  // Règle : un OPL ne fait jamais deux vols d'éval avec le même TRI.
  // Des vols du même TRI sur des jours qui se suivent = une seule rotation, donc une seule éval.
  const triOf = n => { const w = String(n||"").toLowerCase(); return TRI().find(t=>w.startsWith(t.toLowerCase())) || String(n||"").split(" ")[0]; };
  oplList().forEach(o=>{
    const V = volsRows().filter(r=>r.code==="v" && (r.stagiaire.id===o.matricule || r.stagiaire.nom.toUpperCase().startsWith(o.nom.toUpperCase().split(" ")[0]+" ")));
    const byTri = {}; V.forEach(r=>(byTri[triOf(r.instr.nom)] = byTri[triOf(r.instr.nom)] || []).push(r.date));
    Object.entries(byTri).forEach(([t,ds])=>{
      const u = [...new Set(ds)].sort();
      const twice = u.some((d,i)=>i>0 && d > addDays(u[i-1],1));
      if (twice) A.push({k:"crit", tab:"vols", t:`${o.nom} : 2 vols d'éval avec ${t}`, s:`Interdit : même TRI les ${u.map(frDate).join(", ")}. Un des deux vols doit être refait avec un autre TRI.`});
    });
  });
  trainees().filter(t=>t.lache && t.lache>=addDays(TODAY_ISO,-7)).forEach(t=>
    A.push({k:"info", tab:"vols", t:`${t.nom} lâché le ${frDate(t.lache)}`, s:"Penser à clôturer son dossier de formation"}));
  const order = {crit:0,warn:1,info:2};
  return A.sort((a,b)=>order[a.k]-order[b.k]);
}

/* ---------- vols d'instruction (exports TrainerU) ---------- */
const VCODE = {i:"Instr. ligne", n:"Instr. PL", p:"Pré-contrôle", c:"Lâché", e:"Contrôle ligne", v:"Éval"};
const VGROUP = {i:"instr", n:"instr", p:"ctrl", c:"ctrl", e:"ctrl", v:"eval"};
function volsRows(){
  const seen = new Set(), out = [];
  Object.values(st.vols).forEach(rep=>(rep.rows||[]).forEach(r=>{
    const k = r.date+"|"+r.heure+"|"+(r.stagiaire.id||r.stagiaire.nom);
    if (!seen.has(k)) { seen.add(k); out.push(r); }
  }));
  return out.sort((a,b)=>b.date.localeCompare(a.date) || String(b.heure).localeCompare(String(a.heure)));
}
function trainees(){
  const T = {};
  volsRows().forEach(r=>{
    const k = r.stagiaire.nom.toUpperCase().replace(/\s+/g," ");
    const t = T[k] = T[k] || {key:k, nom:r.stagiaire.nom, pos:r.stagiaire.pos, id:r.stagiaire.id, vols:[], n:{}, last:"", lache:""};
    t.vols.push(r); t.n[r.code]=(t.n[r.code]||0)+1;
    if (r.date>t.last) t.last=r.date;
    if (r.code==="c" && r.date>t.lache) t.lache=r.date;
  });
  return Object.values(T);
}
function traineeStatus(t){
  if (t.n.c) return {k:"ok", t:"Lâché"};
  if (t.n.e) return {k:"ok", t:"Contrôle ligne"};
  if (t.n.p) return {k:"info", t:"Pré-contrôle fait"};
  if (t.n.v && !t.n.i && !t.n.n) return {k:"info", t:"En évaluation"};
  return {k:"warn", t:"En instruction"};
}
function vVols(){
  const reps = Object.entries(st.vols).sort((a,b)=>b[0].localeCompare(a[0]));
  if (!reps.length) return `<div class="empty-state">Aucun export TrainerU importé. Envoie-moi le fichier « Crew Training Schedule » et je le charge ici.</div>`;
  const q = ui.volQ.trim().toLowerCase();
  const T = trainees()
    .filter(t=> ui.volF==="all" || t.vols.some(v=>VGROUP[v.code]===ui.volF))
    .filter(t=> !q || t.nom.toLowerCase().includes(q) || t.vols.some(v=>v.instr.nom.toLowerCase().includes(q)))
    .sort((a,b)=>b.last.localeCompare(a.last) || a.nom.localeCompare(b.nom));
  const R = volsRows(), last = reps[0][1];
  const nLache = trainees().filter(t=>t.n.c).length;
  return `
  <div class="kpis">
    <div class="kpi"><b>${R.length}</b><span>activités en vol</span></div>
    <div class="kpi"><b>${trainees().length}</b><span>stagiaires suivis</span></div>
    <div class="kpi ok"><b>${nLache}</b><span>lâchés</span></div>
    <div class="kpi"><b>${R.filter(r=>r.code==="v").length}</b><span>vols d'évaluation</span></div>
  </div>
  <div class="note">Dernier export : ${esc(last.periode||reps[0][0])} (${esc(last.source||"")}). ${reps.length>1?reps.length+" exports cumulés, doublons retirés.":""}</div>
  <input type="search" id="volQ" placeholder="Chercher un stagiaire ou un instructeur…" value="${esc(ui.volQ)}">
  <div class="seg" role="group" aria-label="Filtre">
    <button data-vf="all" aria-pressed="${ui.volF==="all"}">Tous</button>
    <button data-vf="instr" aria-pressed="${ui.volF==="instr"}">Instruction</button>
    <button data-vf="ctrl" aria-pressed="${ui.volF==="ctrl"}">Contrôles</button>
    <button data-vf="eval" aria-pressed="${ui.volF==="eval"}">Évals</button>
  </div>
  <section class="grid2">${T.map(t=>{ const s = traineeStatus(t), open = ui.volOpen[t.key];
    return `<article class="card">
      <div class="row spread"><div><div class="name">${esc(t.nom)}</div><div class="mono">${esc(t.pos)} · ${esc(t.id)}</div></div><span class="pill ${s.k}">${s.t}</span></div>
      <div class="chips">${Object.entries(t.n).map(([c,n])=>`<span class="chip">${VCODE[c]||c} × ${n}</span>`).join("")}</div>

function selStat(o,f){
  const v = o[f]||"";

  return `<select data-stat="${o.matricule}" data-f="${f}" aria-label="${f}" style="border-color:var(--${k==="mute"?"line":k})">${opts.map(s=>`<option ${s===v?"selected":""}>${esc(s)}</option>`).join("")}</select>`;
}

/* ---------- render & events ---------- */
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>{
    b.setAttribute("aria-current", b.dataset.t===ui.tab);
    b.querySelector(".n")?.remove();
  });
  const all = Object.values(st.loaded).every(Boolean);
  if (all) {
    const nc = alerts().filter(a=>a.k==="crit").length;
    if (nc) { const s = document.createElement("span"); s.className="n"; s.textContent=nc; document.querySelector('#tabs [data-t="today"]').appendChild(s); }
  }
  if (!st.db && st.dbFailed) { $("#view").innerHTML = `<div class="empty-state">Ouvre cette page depuis claude.ai en étant connecté pour voir et modifier tes données.</div>`; return; }
  if (!all) return;
  const focusId = document.activeElement && document.activeElement.id, pos = focusId && document.activeElement.selectionStart;
  $("#view").innerHTML = ({today:vToday, evals:vEvals, vols:vVols, simu:vSimu, licences:vLicences, equipes:vEquipes}[ui.tab]||vToday)();
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); try{ if(pos!=null) el.setSelectionRange(pos,pos);}catch(e){} } }
}
function go(t){ ui.tab=t; try{localStorage.setItem("ftm.tab",t);}catch(e){} render(); window.scrollTo(0,0); }
$("#tabs").addEventListener("click", e=>{ const b=e.target.closest("button[data-t]"); if(b) go(b.dataset.t); });

const V = $("#view");
V.addEventListener("click", async e=>{
  const t = e.target.closest("button, .chip"); if (!t) return;
  const d = t.dataset;
  if (d.go) return go(d.go);
  if (d.open || d.pick) { const m = d.open||d.pick, o = st.opl[m]; ui.form[m] = {tri: d.tri || triDispo(o)[0], date: (ui.form[m]&&ui.form[m].date)||""}; return render(); }
  if (d.cancelform) { delete ui.form[d.cancelform]; return render(); }
  if (d.done || d.del) {
    const m = d.done||d.del, o = st.opl[m]; let P = (o.programmes||[]).map(p=>({...p}));
    const p = P.find(x=>x.id===d.pid); if (!p) return;
    if (d.del) { P = P.filter(x=>x.id!==d.pid); return write("opl/"+m, {programmes:P}, "Vol retiré"); }
    p.statut = "fait";
    const ex = [...(o.exclus||[])]; if (!ex.some(x=>x.toLowerCase()===p.tri.toLowerCase())) ex.push(p.tri);
    return write("opl/"+m, {programmes:P, exclus:ex, evalsRestantes:Math.max(0,(o.evalsRestantes||0)-1)}, "Vol d'éval enregistré");
  }
  if (t.id==="togPipe") { ui.showPipeline=!ui.showPipeline; return render(); }
  if (d.toeval) return write("opl/"+d.toeval, {evalsRestantes:5, priorite:"mois", echeance:addDays(TODAY_ISO,30)}, "OPL passé en évaluations");
  if (d.month) { ui.simuMonth=d.month; return render(); }
  if (d.sf) { ui.simuFilter=d.sf; return render(); }
  if (d.lf) { ui.licFilter=d.lf; return render(); }
  if (d.vf) { ui.volF=d.vf; return render(); }
  if (d.vopen) { ui.volOpen[d.vopen]=!ui.volOpen[d.vopen]; return render(); }
  if (d.slot) { ui.form.slot=d.slot; render(); document.getElementById("slotin")?.focus(); return; }
  if (d.lic) { const R = lics().map(r=>({...r})); R[+d.lic].fait=!R[+d.lic].fait; return write("ref/licences", {rows:R}, R[+d.lic].fait?"Licence marquée renouvelée":"Modification annulée"); }
  if (d.deltask) { try { await st.db.doc("taches/"+d.deltask).delete(); } catch(err){ toast("Suppression impossible."); } return; }
});
V.addEventListener("change", e=>{
  const t = e.target, d = t.dataset;
  if (t.id && t.id.startsWith("tri-")) { ui.form[t.id.slice(4)].tri = t.value; }
  if (t.id && t.id.startsWith("date-")) { ui.form[t.id.slice(5)].date = t.value; }
  if (d.stat) write("opl/"+d.stat, {[d.f]:t.value}, "Statut mis à jour");
  if (d.task) write("taches/"+d.task, {fait:t.checked});
  if (d.cand!=null && d.cand!=="") { const C=(st.ref.equipes.candidatsTRI||[]).map(c=>({...c})); C[+d.cand].statut=t.value; write("ref/equipes",{candidatsTRI:C},"Statut mis à jour"); }
});
V.addEventListener("input", e=>{
  if (e.target.id==="licQ") { ui.licQ=e.target.value; render(); }
  if (e.target.id==="eqQ") { ui.eqQ=e.target.value; render(); }
  if (e.target.id==="volQ") { ui.volQ=e.target.value; render(); }
});
V.addEventListener("submit", async e=>{
  e.preventDefault(); const f = e.target;
  if (f.id==="fTask") {
    const txt = $("#taskTxt").value.trim(); if (!txt || !st.db) return;
    try { await st.db.collection("taches").add({texte:txt, echeance:$("#taskDate").value||"", fait:false, cree:TODAY_ISO}); toast("Tâche ajoutée"); }
    catch(err){ toast("Échec de l'enregistrement, réessaie."); }
    return;
  }
  if (f.dataset.prog) {
    const m = f.dataset.prog, o = st.opl[m];
    const tri = document.getElementById("tri-"+m).value, date = document.getElementById("date-"+m).value;
    if (!tri) return;
    const P = [...(o.programmes||[]), {id:"p"+Date.now().toString(36), tri, date, statut:"programmé"}];
    delete ui.form[m];
    return write("opl/"+m, {programmes:P}, `Vol avec ${tri} programmé`);
  }
  if (f.dataset.slotform) {
    const [mois, ji, si] = f.dataset.slotform.split("|"), val = $("#slotin").value.trim();
    const J = JSON.parse(JSON.stringify(st.simu[mois].jours)); J[+ji].slots[+si].instr = val;
    delete ui.form.slot;
    return write("simu/"+mois, {jours:J}, "Séance mise à jour");
  }
});

render();
(async function boot(){
  const db = window.claude && await window.claude.use("db");
  if (!db) { st.dbFailed = true; return render(); }
  st.db = db;
  const sub = (name, fn) => db.collection(name).onSnapshot(s=>{ fn(s); st.loaded[name]=true; render(); }, ()=>{ st.loaded[name]=true; render(); });
  sub("opl", s=>{ st.opl={}; s.docs.forEach(d=>st.opl[d.id]=d.data()); });
  sub("ref", s=>{ st.ref={}; s.docs.forEach(d=>st.ref[d.id]=d.data()); });
  sub("simu", s=>{ st.simu={}; s.docs.forEach(d=>st.simu[d.id]=d.data()); });
  sub("vols", s=>{ st.vols={}; s.docs.forEach(d=>st.vols[d.id]=d.data()); });
  sub("taches", s=>{ st.taches={}; s.docs.forEach(d=>st.taches[d.id]=d.data()); });
})();
})();
</script>
