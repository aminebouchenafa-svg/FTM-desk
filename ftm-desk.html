<title>FTM Desk 737</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: glass top bar (brand, alarms, day/night switch), then rounded cards on a soft violet glow.
   Palette from the reference screens: lavender day, starry indigo night, indigo→violet gradient for primary actions. */
:root{
  --bg:#F3F2F9; --glow1:rgba(139,92,246,.16); --glow2:rgba(91,63,214,.10); --stars:transparent;
  --surface:#FCFBFF; --surface2:#F1EEFB; --line:#D9D3F0; --line2:#C9C1EB;
  --ink:#1B1350; --muted:#605B7D; --head:#1B1350;
  --accent:#5B3FD6; --accent2:#8B5CF6; --accent-ink:#4A2FC4; --chipbg:#E6E1F8;
  --grad:linear-gradient(90deg,#3A1FA6,#8B5CF6);
  --ok:#14864C; --ok-bg:#E3F5EA; --warn:#B66A00; --warn-bg:#FCF0D9; --crit:#D2352B; --crit-bg:#FCE6E4;
  --shadow:0 10px 30px rgba(59,31,166,.08);
  --font:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Poppins",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0A22; --glow1:rgba(124,92,255,.30); --glow2:rgba(59,31,166,.28); --stars:rgba(255,255,255,.55);
  --surface:#100E2B; --surface2:#17143A; --line:#2A2652; --line2:#3A3470;
  --ink:#F2F0FF; --muted:#A8A4C7; --head:#FFFFFF;
  --accent:#8F72FF; --accent2:#A78BFA; --accent-ink:#B9A6FF; --chipbg:#1E1A48;
  --ok:#4ADE80; --ok-bg:#10301F; --warn:#FBBF24; --warn-bg:#33270B; --crit:#FB7268; --crit-bg:#3A1418;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0A22; --glow1:rgba(124,92,255,.30); --glow2:rgba(59,31,166,.28); --stars:rgba(255,255,255,.55);
  --surface:#100E2B; --surface2:#17143A; --line:#2A2652; --line2:#3A3470;
  --ink:#F2F0FF; --muted:#A8A4C7; --head:#FFFFFF;
  --accent:#8F72FF; --accent2:#A78BFA; --accent-ink:#B9A6FF; --chipbg:#1E1A48;
  --ok:#4ADE80; --ok-bg:#10301F; --warn:#FBBF24; --warn-bg:#33270B; --crit:#FB7268; --crit-bg:#3A1418;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.5;background:
  radial-gradient(1px 1px at 12% 22%,var(--stars),transparent 60%),radial-gradient(1px 1px at 72% 12%,var(--stars),transparent 60%),
  radial-gradient(1px 1px at 38% 64%,var(--stars),transparent 60%),radial-gradient(1px 1px at 86% 48%,var(--stars),transparent 60%),
  radial-gradient(1px 1px at 22% 86%,var(--stars),transparent 60%),radial-gradient(1px 1px at 58% 36%,var(--stars),transparent 60%),
  radial-gradient(60% 40% at 50% 8%,var(--glow1),transparent 70%),radial-gradient(50% 40% at 85% 60%,var(--glow2),transparent 70%),var(--bg);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* barre du haut */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px}
.top .l{display:flex;align-items:center;gap:10px;min-width:0}
.logo{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;font:700 .78rem var(--font);letter-spacing:.02em;box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--line2)}
.brand{display:grid;line-height:1.15;min-width:0}
h1{font:600 1.15rem var(--font);margin:0;color:var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font:400 .74rem var(--font);color:var(--muted);white-space:nowrap}
.back{border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font:500 .82rem var(--font);cursor:pointer}
.masters{display:flex;gap:8px;align-items:center}
.master{min-width:44px;height:40px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);color:var(--muted);font:600 .62rem var(--font);text-transform:uppercase;letter-spacing:.04em;cursor:pointer;display:flex;align-items:center;gap:6px;padding:0 12px}
.master .ml{display:inline}
.master b{font:700 .9rem var(--font)}
.master.on.w{background:var(--crit);border-color:var(--crit);color:#fff;box-shadow:0 0 18px color-mix(in srgb,var(--crit) 45%,transparent)}
.master.on.c{background:var(--warn);border-color:var(--warn);color:#1B1350}
@media (prefers-reduced-motion:no-preference){.master.on.w{animation:mw 1.4s ease-in-out infinite}@keyframes mw{50%{box-shadow:0 0 4px transparent}}}
.themebtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:var(--surface2);color:var(--accent);display:grid;place-items:center;cursor:pointer}
.themebtn svg{width:20px;height:20px}
@media (max-width:520px){#back:not([hidden]) ~ .logo{display:none}.back .bt{display:none}.back{padding:7px 12px;font-size:1rem}.master{padding:0 11px}.du{padding:14px;border-radius:24px}.master .ml{display:none}.clock .dt{display:none}h1{font-size:1rem}.logo{width:34px;height:34px;font-size:.68rem}}
main{padding-block:18px 64px;display:grid;gap:18px}
main>*{min-width:0}
.hero{text-align:center;display:grid;gap:4px;padding-block:6px 2px}
.hero h2{font:800 clamp(1.7rem,6vw,2.7rem) var(--font);letter-spacing:-.01em;text-transform:none;color:var(--head);margin:0;
  background:linear-gradient(180deg,var(--head),color-mix(in srgb,var(--head) 60%,var(--accent2)));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{margin:0;color:var(--muted)}
/* grille d'accueil */
.deck{display:grid;gap:18px;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-areas:"eicas cdu" "ovh cdu" "ovh memo";align-items:start}
.deck>*{min-width:0}
@media (max-width:760px){.deck{grid-template-columns:minmax(0,1fr);grid-template-areas:"cdu" "eicas" "ovh" "memo"}}
/* cartes */
.du{background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:18px;display:grid;gap:12px;min-width:0;align-content:start}
.du-t{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 8px;font:600 .95rem var(--font);color:var(--head)}
.du-t span{color:var(--muted);font-weight:400;font-size:.78rem}
h2{font:600 .8rem var(--font);text-transform:uppercase;letter-spacing:.08em;color:var(--accent-ink);margin:6px 0 0}
h3{font:600 1rem var(--font);margin:0;color:var(--head)}
/* alarmes */
.eicas{display:grid;gap:6px}
.msgl{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:14px;color:var(--ink);font:500 .88rem var(--font);padding:9px 12px;cursor:pointer}
.msgl::before{content:"";flex:0 0 auto;width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--accent)}
.msgl .m{flex:1;min-width:0}
.msgl .d{display:block;color:var(--muted);font:400 .76rem var(--font);margin-top:1px}
.msgl.crit::before{background:var(--crit);box-shadow:0 0 0 3px var(--crit-bg)} .msgl.crit{border-color:color-mix(in srgb,var(--crit) 35%,var(--line))}
.msgl.warn::before{background:var(--warn);box-shadow:0 0 0 3px var(--warn-bg)}
.msgl.ok::before{background:var(--ok)}
.msgl:hover{border-color:var(--line2)}
/* modules */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:10px;box-shadow:var(--shadow)}
.panel-t{grid-column:1/-1;font:600 .95rem var(--font);color:var(--head)}
.ann{position:relative;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:20px;padding:12px 12px 11px;text-align:left;cursor:pointer;display:grid;gap:2px;min-height:76px;font:inherit}
.ann .c{font:600 .92rem var(--font)}
.ann .s{font-size:.72rem;color:var(--muted);line-height:1.25}
.ann .k{position:absolute;top:9px;right:10px;font:700 .72rem var(--font);min-width:22px;height:22px;border-radius:999px;display:grid;place-items:center;padding:0 6px;color:#fff;background:var(--accent)}
.ann .lt{display:none}
.ann.warn{border-color:color-mix(in srgb,var(--warn) 55%,var(--line))} .ann.warn .k{background:var(--warn);color:#1B1350}
.ann.crit{border-color:color-mix(in srgb,var(--crit) 60%,var(--line));box-shadow:0 0 0 3px var(--crit-bg)} .ann.crit .k{background:var(--crit)}
.ann:hover{border-color:var(--accent2)}
/* recherche pilote */
.cdu .sp{display:flex;gap:8px;align-items:center;background:var(--surface2);border:1px solid var(--line2);border-radius:999px;padding:4px 6px 4px 16px}
.cdu .sp b{font:600 .72rem var(--font);color:var(--accent-ink);letter-spacing:.06em}
.cdu input[type=search]{border:0;background:transparent;color:var(--ink);font:500 .98rem var(--font);padding:8px 4px;flex:1;min-width:0;outline:none}
.lsk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;text-align:left;padding:9px 2px;cursor:pointer}
.lsk:hover .n{color:var(--accent-ink)}
.lsk .k{width:30px;height:30px;border-radius:50%;background:var(--chipbg);border:1px solid var(--line2)}
.lsk .n{font:600 .9rem var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lsk .n small{display:block;font:400 .74rem var(--font);color:var(--muted)}
.lsk .s{font:600 .72rem var(--font);text-align:right;white-space:nowrap}
.c-grn{color:var(--ok)} .c-amb{color:var(--warn)} .c-red{color:var(--crit)} .c-cyn{color:var(--accent-ink)} .c-mag{color:var(--accent)} .c-dim{color:var(--muted)} .c-w{color:var(--ink)}
/* compteurs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--surface2);border:1px solid var(--line);border-radius:18px;padding:11px 13px;text-align:left;color:inherit;font:inherit}
.kpi b{display:block;font:700 clamp(1.05rem,4.2vw,1.45rem) var(--font);line-height:1.15;color:var(--head);overflow-wrap:anywhere}
.kpi span{font:500 .72rem var(--font);color:var(--muted)}
.kpi.crit b{color:var(--crit)} .kpi.warn b{color:var(--warn)} .kpi.ok b{color:var(--ok)} .kpi.mag b{color:var(--accent)} .kpi.w b{color:var(--head)}
.list{display:grid;gap:8px}
.item{background:var(--surface2);border:1px solid var(--line);border-left:4px solid var(--line2);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;color:var(--ink)}
.item.crit{border-left-color:var(--crit)} .item.warn{border-left-color:var(--warn)} .item.info{border-left-color:var(--accent)} .item.ok{border-left-color:var(--ok)}
.item .txt{flex:1 1 150px;min-width:0}
button.item{width:100%;text-align:left;font:inherit;cursor:pointer}
.sub{color:var(--muted);font-size:.8rem}
.pill{display:inline-block;font:600 .68rem var(--font);letter-spacing:.03em;text-transform:uppercase;padding:3px 10px;border-radius:999px;white-space:nowrap;background:var(--chipbg);color:var(--accent-ink)}
.pill.crit{background:var(--crit-bg);color:var(--crit)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.info{background:var(--chipbg);color:var(--accent-ink)} .pill.mute{background:transparent;border:1px solid var(--line2);color:var(--muted)} .pill.mag{background:var(--grad);color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px;display:grid;gap:10px;min-width:0;box-shadow:var(--shadow)}
.card.crit{border-color:color-mix(in srgb,var(--crit) 55%,var(--line))} .card.warn{border-color:color-mix(in srgb,var(--warn) 55%,var(--line))} .card.done{opacity:.65}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.grow{flex:1 1 160px;min-width:0}
.name{font:600 1rem var(--font);color:var(--head)}
.mono{font:400 .78rem var(--font);color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 .8rem var(--font);padding:4px 11px;border-radius:999px;border:1px solid var(--line2);background:var(--surface2);color:var(--ink)}
button.chip{cursor:pointer}
.chip.free{border-color:color-mix(in srgb,var(--ok) 60%,var(--line));color:var(--ok);background:var(--ok-bg)}
.chip.free.sug{font-weight:700;box-shadow:inset 0 0 0 1px var(--ok)}
.chip.no{text-decoration:line-through;color:var(--muted);background:transparent}
.chip.pend{border-color:var(--accent);color:var(--accent-ink);background:var(--chipbg)}
.chip.on{background:var(--grad);border-color:transparent;color:#fff}
.big{font:700 1.5rem var(--font);line-height:1;color:var(--head);font-variant-numeric:tabular-nums}
.stats{display:flex;gap:20px;flex-wrap:wrap}
.stats .note{font-size:.72rem}
.prog{display:grid;gap:6px}
.prog .p{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.86rem;padding:7px 10px;border-radius:12px;background:var(--surface2);border:1px solid var(--line)}
/* boutons */
button.b{font:500 .84rem var(--font);border-radius:999px;padding:8px 16px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);cursor:pointer}
button.b:hover{border-color:var(--accent2)}
button.b.pri{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(91,63,214,.28)}
button.b.okb{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
button.b.crb{border-color:var(--crit);color:var(--crit);background:var(--crit-bg)}
button.b.sm{padding:5px 12px;font-size:.76rem}
button.b:disabled{opacity:.4;cursor:not-allowed}
button.link{border:0;background:none;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
select,input[type=text],input[type=date],input[type=number],input[type=search],textarea{font:400 .9rem var(--font);padding:8px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--surface2);color:var(--ink);min-width:0;max-width:100%}
input[type=number]{width:90px}
input[type=search]{width:100%}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}
textarea{width:100%;min-height:70px;resize:vertical}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px;border-radius:18px;background:var(--surface2);border:1px solid var(--line)}
.form label{font:500 .74rem var(--font);color:var(--muted);display:grid;gap:3px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;flex-wrap:wrap;background:var(--chipbg);padding:3px;gap:2px}
.seg button{border:0;border-radius:999px;background:transparent;color:var(--muted);font:500 .8rem var(--font);padding:6px 13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--grad);color:#fff}
.day{display:grid;gap:6px}
.dayh{font:600 .92rem var(--font);display:flex;gap:8px;align-items:baseline;color:var(--head)}
.dayh.today{color:var(--accent)}
.slot{display:grid;grid-template-columns:58px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line2);border-radius:14px;padding:9px 11px}
.slot.empty{border-left-color:var(--crit)} .slot.mine{border-left-color:var(--accent);background:var(--chipbg)}
.slot .t{font:400 .76rem var(--font);color:var(--muted)}
.slot .t b{display:block;color:var(--accent-ink);font-weight:700}
.slot .w{min-width:0;display:grid;gap:3px}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:600 .7rem var(--font);text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink);white-space:nowrap}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.cell{white-space:nowrap;font-size:.8rem}
td.cell.crit{color:var(--crit);background:var(--crit-bg)} td.cell.warn{color:var(--warn);background:var(--warn-bg)} td.cell.ok{color:var(--ok)}
.note{font-size:.8rem;color:var(--muted)}
.empty-state{border:1px dashed var(--line2);border-radius:20px;padding:22px;text-align:center;color:var(--muted);background:var(--surface)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--grad);color:#fff;font:500 .88rem var(--font);padding:10px 18px;border-radius:999px;z-index:20;max-width:calc(100% - 32px);box-shadow:0 10px 26px rgba(59,31,166,.35)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.grid2>*{min-width:0}
/* jauges */
.gauge{position:relative;height:12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.gauge i{position:absolute;inset:0 auto 0 0;background:var(--grad);border-radius:999px}
.gauge.warn i{background:var(--warn)} .gauge.crit i{background:var(--crit)} .gauge.ok i{background:var(--ok)}
.gauge u{position:absolute;top:0;bottom:0;width:2px;background:var(--head);opacity:.35}
.gscale{display:flex;justify-content:space-between;font:400 .68rem var(--font);color:var(--muted)}
.msg{white-space:pre-wrap;font:400 .82rem var(--font);background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px;overflow-x:auto;color:var(--ink)}
details>summary{cursor:pointer;font:600 .84rem var(--font);color:var(--accent-ink)}
.tip{display:grid;gap:4px;padding:11px 13px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.tip b{font:600 .9rem var(--font)}
/* fiche pilote */
.fma{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px}
.fma div{border:1px solid var(--line2);padding:7px 6px;text-align:center;font:500 .72rem var(--font);color:var(--muted);border-radius:999px;background:var(--surface2)}
.fma .done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 55%,var(--line));background:var(--ok-bg)}
.fma .act{color:#fff;border-color:transparent;background:var(--grad);font-weight:600;box-shadow:0 6px 16px rgba(91,63,214,.3)}
.idn{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.idn .nm{font:700 1.5rem var(--font);color:var(--head);line-height:1.15}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.flds{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(140px,100%),1fr));gap:10px}
.fld{display:grid;gap:5px;background:var(--surface2);border:1px solid var(--line);border-radius:18px;padding:10px 12px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld>span{font:500 .74rem var(--font);color:var(--muted)}
.fld select{width:100%;font:600 1rem var(--font);color:var(--head)}
.fld input{font:600 1rem var(--font);color:var(--head);background:var(--surface);border:1px solid var(--line2);padding:9px 11px;width:100%}
.du>*,.flds>*,.fld>*{min-width:0}
.fld input[type=date]{min-width:0;max-width:100%;font-size:.9rem;padding:8px 9px}
.item{flex-wrap:wrap}
.fld input:focus{border-color:var(--accent)}
.fld small{font:400 .7rem var(--font);color:var(--muted)}
.fld.crit input{color:var(--crit);border-color:var(--crit)} .fld.warn input{color:var(--warn);border-color:var(--warn)}
.sws{display:grid;gap:8px}
.swr{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.swr .txt{min-width:0}
.swr.on{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.swr.on b{color:var(--accent-ink)}

<header>
  <div class="wrap top">
    <div class="l"><button class="back" id="back" hidden aria-label="Retour à l'accueil">‹<span class="bt"> Accueil</span></button><span class="logo" aria-hidden="true">FTM</span><div class="brand"><h1 id="ttl">FTM Desk</h1><span class="clock" id="clock"></span></div></div>
    <div class="masters">
      <button class="master w" id="mw" aria-label="Alarmes rouges"><span class="ml">Urgent</span><b id="mwn">0</b></button>
      <button class="master c" id="mc" aria-label="Alarmes orange"><span class="ml">À suivre</span><b id="mcn">0</b></button>
      <button class="themebtn" id="themeBtn" aria-label="Mode jour ou nuit"></button>
    </div>
  </div>
</header>
<main class="wrap" id="view">
  <div class="empty-state">Chargement de ton FTM Desk : alarmes, pilotes, évaluations, simulateur…</div>
</main>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const ME = "BOUCHENAFA";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const T0 = iso(TODAY);
const addDays = (s,n) => { const d = new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return iso(d); };
const addMonths = (s,n) => { const d = new Date(s+"T00:00:00"); d.setMonth(d.getMonth()+n); return iso(d); };
const daysTo = s => Math.round((new Date(s+"T00:00:00") - TODAY)/864e5);
const frDate = s => { if(!s) return ""; const [y,m,d] = s.split("-"); return d+"/"+m+"/"+y; };
const frToIso = s => { const m = /^(\d\d)\/(\d\d)\/(\d{4})$/.exec(s||""); return m ? m[3]+"-"+m[2]+"-"+m[1] : ""; };
const JOURS = ["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
const MOIS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const dayLabel = s => { const d = new Date(s+"T00:00:00"); return JOURS[d.getDay()]+" "+d.getDate()+" "+MOIS[d.getMonth()]; };
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9 ]/g," ").replace(/\s+/g," ").trim();
const surname = s => { const w = norm(s).split(" "); return ["EL","AIT","BEN","OULD","SABER","HADJ","AHMED","NAIT"].includes(w[0]) && w[1] ? w[0]+" "+w[1] : (w[0]||""); };
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
const jx = n => n===0?"aujourd'hui":(n>0?"J-"+n:"dépassé de "+(-n)+" j");
function tick(){ const d = new Date(); const el = document.getElementById("clock"); if (el) el.innerHTML = `<span class="dt">${dayLabel(T0)} ${TODAY.getFullYear()} · </span>LCL ${pad(d.getHours())}:${pad(d.getMinutes())} · ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}Z`; }
tick(); setInterval(tick, 20000);

const COLS = ["opl","ref","simu","vols","memos","events","instr","init","valid","max","simulog","perso","fiches"];
const st = { db:null, dbFailed:false, loaded:{} }; COLS.forEach(c=>{ st[c]={}; st.loaded[c]=false; });
const ui = { view:"home", form:{}, f:{}, pid:null };
const VIEWS = ["home","pilotes","fiche","memos","events","lacher","init","pl","evals","simu","valid","max","equipes","vols","dim","moi","regles"];
try { const t = localStorage.getItem("ftm.view"); if (VIEWS.includes(t)) ui.view = t; ui.pid = localStorage.getItem("ftm.pid"); } catch(e) {}
const h = (location.hash||"").slice(1); if (VIEWS.includes(h)) ui.view = h;
const F = (k,d) => (k in ui.f ? ui.f[k] : d);

function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(()=>t.hidden = true, 2600); }
const fail = e => toast(e && e.code === "invalid_argument" ? "Modification refusée (droits ou format)." : e && e.code==="quota_exceeded" ? "Base pleine : supprime d'anciens éléments." : "Échec de l'enregistrement, réessaie.");
async function upd(path, data, ok){ if(!st.db) return toast("Base indisponible."); try{ await st.db.doc(path).update(data); if(ok) toast(ok);}catch(e){ fail(e);} }
async function put(path, data, ok){ if(!st.db) return toast("Base indisponible."); try{ await st.db.doc(path).set(data); if(ok) toast(ok);}catch(e){ fail(e);} }
async function del(path, ok){ if(!st.db) return; try{ await st.db.doc(path).delete(); if(ok) toast(ok);}catch(e){ fail(e);} }
async function add(col, data, ok){ if(!st.db) return toast("Base indisponible."); try{ await st.db.collection(col).add(data); if(ok) toast(ok);}catch(e){ fail(e);} }

/* ---------- règles (modifiables, à confirmer avec le Manex D) ---------- */
const DEF_REGLES = { legsLacher:40, legsAlerte:36, legsSafety:4, plHeures:100, plEtapes:25, initHeures:150, evalsStd:5, clMois:12,
  validTypes:["CL","IC","IL","Check TRI","CRM","DGR","SMS","Sûreté","SSP1","SSP2"], manexConfirme:false };
const R = () => Object.assign({}, DEF_REGLES, st.ref.regles||{});
const CAUSES = [["CGML","Maladie (CGML)"],["ABS","Absence pilote"],["IRGAV","Irrégularité avion"],["AMP","Amplitude"],["ABSTRI","Absence TRI"],["SOLL","Sollicitation"]];
const causeLabel = c => (CAUSES.find(x=>x[0]===c)||[c,c])[1];
const SOURCES = ["DO","SDF","SDPNT","Chef secteur ligne","Adjoint","Formation","Programmes","Moi"];

/* ---------- évaluations (OPL, passage CDB, entraînement ciblé) ---------- */
const TRI = () => (st.ref.tri && st.ref.tri.evaluateurs) || [];
const GROUPES = {OPL:"OPL / PL", CDB:"Passage CDB", CIBLE:"Entraînement ciblé"};
const ev = () => Object.values(st.opl).sort((a,b)=>(a.ordre||0)-(b.ordre||0));
const inEval = o => typeof o.evalsRestantes === "number";
const pending = o => (o.programmes||[]).filter(p=>p.statut==="programmé");
const faits = o => (o.total||R().evalsStd) - (o.evalsRestantes||0);
const aPlanifier = o => Math.max(0,(o.evalsRestantes||0) - pending(o).length);
function triLoad(){ const L = {}; TRI().forEach(t=>L[t]=0); ev().forEach(o=>pending(o).forEach(p=>{ L[p.tri]=(L[p.tri]||0)+1; })); return L; }
function triDispo(o){
  const no = new Set([...(o.exclus||[]), ...pending(o).map(p=>p.tri)].map(norm));
  const L = triLoad();
  return TRI().filter(t=>!no.has(norm(t))).sort((a,b)=>(L[a]-L[b]) || a.localeCompare(b));
}
function evLevel(o){
  if (!inEval(o)) return "";
  if ((o.evalsRestantes||0) === 0 && !(o.simuRequis>(o.simuFaits||0))) return "done";
  const g = o.groupe||"OPL";
  if (g==="CDB" && faits(o) >= (o.total||5)-1 && o.evalsRestantes>0) return "crit";
  if (o.echeance && o.echeance < T0 && aPlanifier(o)>0) return "crit";
  if (o.echeance && daysTo(o.echeance) <= 7 && o.evalsRestantes>0) return "crit";
  if (o.echeance && daysTo(o.echeance) <= 21 && aPlanifier(o)>0) return "warn";
  return "";
}

/* ---------- simulateur ---------- */
const SLOTS = ["06:00","10:15","14:30","18:45","23:00"];
function allSlots(){
  const out = [];
  Object.values(st.simu).forEach(m => (m.jours||[]).forEach((j,ji) => (j.slots||[]).forEach((s,si) => out.push({mois:m.mois, ji, si, date:j.date, ...s}))));
  return out.sort((a,b)=> a.date.localeCompare(b.date) || a.s-b.s);
}
const isMine = s => norm(s.instr).includes(ME);
const isEmptySlot = s => !String(s.instr||"").replace(/^(TRI|TRE)\s*[:;]?\s*$/i,"").trim() && (s.crew||"").trim();
function instrNames(txt){
  return String(txt||"").split(/\+/).map(x=>x.replace(/\b(IC|IE|CBTA|TRI|TRE)\b\s*[:;]?/gi,"").trim()).filter(Boolean).map(surname).filter(Boolean);
}
function triPool(){
  const P = new Map();
  ((st.ref.tri&&st.ref.tri.secteur)||[]).forEach(n=>P.set(surname(n), n));
  TRI().forEach(n=>{ if(!P.has(surname(n))) P.set(surname(n), n); });
  allSlots().forEach(s=>instrNames(s.instr).forEach(n=>{ if(!P.has(n)) P.set(n, n.charAt(0)+n.slice(1).toLowerCase()); }));
  return P;
}
const busyOn = d => new Set(allSlots().filter(s=>s.date===d).flatMap(s=>instrNames(s.instr)));
function monthLoad(mois){ const L={}; allSlots().filter(s=>s.mois===mois).forEach(s=>instrNames(s.instr).forEach(n=>L[n]=(L[n]||0)+1)); return L; }
function permutations(slot){
  const pool = triPool(), busy = busyOn(slot.date), L = monthLoad(slot.mois);
  const libres = [...pool.entries()].filter(([k])=>!busy.has(k)).sort((a,b)=>(L[a[0]]||0)-(L[b[0]]||0)).slice(0,8).map(([k,n])=>({k,n,load:L[k]||0}));
  const mine = instrNames(slot.instr);
  const echanges = [];
  if (mine.length===1) allSlots().forEach(o=>{
    if (o===slot || o.mois!==slot.mois || Math.abs(daysTo(o.date)-daysTo(slot.date))>3 || (o.date===slot.date && o.s===slot.s)) return;
    const on = instrNames(o.instr); if (on.length!==1 || on[0]===mine[0]) return;
    const freeA = !busyOn(o.date).has(mine[0]) || o.date===slot.date, freeB = !busy.has(on[0]) || o.date===slot.date;
    if (o.date!==slot.date && freeA && freeB) echanges.push(o);
  });
  return {libres, echanges:echanges.slice(0,6)};
}
async function setSlot(mois, ji, si, patch, logTxt){
  const J = JSON.parse(JSON.stringify(st.simu[mois].jours));
  if (patch===null) J[ji].slots.splice(si,1); else Object.assign(J[ji].slots[si], patch);
  await upd("simu/"+mois, {jours:J});
  if (logTxt) await add("simulog", {date:T0, texte:logTxt, notifie:false, cree:Date.now()});
}

/* ---------- lâcher en ligne ---------- */
const lacherList = () => Object.entries(st.instr).map(([id,d])=>({id,...d}));
const legsOf = p => (p.vols||[]).reduce((n,v)=>n+(+v.legs||0),0) + (+p.legsInit||0);
const safetyNames = () => new Set(((st.ref.equipes&&st.ref.equipes.safety)||[]).map(p=>surname(p.nom)));
function lacherState(p){
  const r = R(), L = legsOf(p);
  if (p.lache) return {k:"ok", t:"Lâché le "+frDate(p.lache)};
  if (p.cl && (p.cl.faits||0) > 0) return {k:"info", t:`Check Line ${p.cl.faits}/${p.cl.requis||2}`};
  if (L >= r.legsLacher) return {k:"crit", t:"40 legs : Check Line à programmer"};
  if (L >= r.legsAlerte) return {k:"crit", t:`${L} legs : à suivre de près`};
  return {k: p.preControle?"info":"", t: p.preControle?"Pré-contrôle fait":"En instruction"};
}
function legsSansSafety(p){
  const r = R(), S = safetyNames(); let cum = +p.legsInit||0; const bad = [];
  (p.vols||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(v=>{
    if (cum < r.legsSafety && !(v.safety && (S.size===0 || S.has(surname(v.safety))))) bad.push(v);
    cum += (+v.legs||0);
  });
  return bad;
}

/* ---------- validités ---------- */
const validList = () => Object.entries(st.valid).map(([id,d])=>({id,...d}));
function cellLevel(d){ if(!d) return ""; const n = daysTo(d); return n<0?"crit":(n<=30?"warn":"ok"); }

/* ---------- memos / événements ---------- */
const memos = () => Object.entries(st.memos).map(([id,d])=>({id,...d}));
const events = () => Object.entries(st.events).map(([id,d])=>({id,...d})).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
function memoLevel(m){ if (m.fait) return "ok"; if (!m.echeance) return "info"; const n = daysTo(m.echeance); return n<0?"crit":(n<=2?"crit":(n<=7?"warn":"info")); }

/* ---------- licences ---------- */
const lics = () => (st.ref.licences && st.ref.licences.rows) || [];
function licStatus(r){
  if (r.fait) return {k:"ok", t:"Renouvelée"};
  if (!r.validite) return {k:"warn", t:"Date manquante"};
  const d = frToIso(r.validite); if (d < T0) return {k:"crit", t:"Échue"};
  if (daysTo(d) <= 30) return {k:"warn", t:"< 30 j"}; return {k:"ok", t:"Valide"};
}

/* ---------- vols TrainerU ---------- */
const VCODE = {i:"Instr. ligne", n:"Instr. PL", p:"Pré-contrôle", c:"Lâché", e:"Contrôle ligne", v:"Éval"};
const VGROUP = {i:"instr", n:"instr", p:"ctrl", c:"ctrl", e:"ctrl", v:"eval"};
function volsRows(){
  const seen = new Set(), out = [];
  Object.values(st.vols).forEach(rep=>(rep.rows||[]).forEach(r=>{ const k = r.date+"|"+r.heure+"|"+(r.stagiaire.id||r.stagiaire.nom); if (!seen.has(k)) { seen.add(k); out.push(r); } }));
  return out.sort((a,b)=>b.date.localeCompare(a.date) || String(b.heure).localeCompare(String(a.heure)));
}
function trainees(){
  const T = {};
  volsRows().forEach(r=>{ const k = norm(r.stagiaire.nom);
    const t = T[k] = T[k] || {key:k, nom:r.stagiaire.nom, pos:r.stagiaire.pos, id:r.stagiaire.id, vols:[], n:{}, last:"", lache:""};
    t.vols.push(r); t.n[r.code]=(t.n[r.code]||0)+1; if (r.date>t.last) t.last=r.date; if (r.code==="c" && r.date>t.lache) t.lache=r.date; });
  return Object.values(T);
}

/* ---------- alarmes (tous modules) ---------- */
function alerts(){
  const A = [], r = R();
  // évaluations
  ev().forEach(o=>{
    if (!inEval(o)) return;
    const lv = evLevel(o), n = aPlanifier(o), g = o.groupe||"OPL";
    if (g==="CDB" && faits(o) >= (o.total||5)-1 && o.evalsRestantes>0)
      A.push({k:"crit", v:"evals", t:`${o.nom} : ${faits(o)} évals faites, il en reste ${o.evalsRestantes}`, s:`À finir avant le ${frDate(o.echeance)||"collège"} (${jx(daysTo(o.echeance))})`});
    else if (lv==="crit" && o.evalsRestantes>0) A.push({k:"crit", v:"evals", t:`${o.nom} : ${o.evalsRestantes} éval${o.evalsRestantes>1?"s":""} restante${o.evalsRestantes>1?"s":""} (${n} à programmer)`, s:`${GROUPES[g]} · échéance ${frDate(o.echeance)} ${jx(daysTo(o.echeance))}`});
    else if (lv==="warn") A.push({k:"warn", v:"evals", t:`${o.nom} : ${n} vol${n>1?"s":""} d'éval à programmer`, s:`${GROUPES[g]} · échéance ${frDate(o.echeance)}`});
    pending(o).forEach(p=>{ if (p.date && p.date < T0) A.push({k:"warn", v:"evals", t:`${o.nom} : éval avec ${p.tri} du ${frDate(p.date)}`, s:"Date passée : marque-la faite, ou ratée avec la cause"}); });
    if (o.simuRequis && (o.simuFaits||0) < o.simuRequis) A.push({k:"warn", v:"evals", t:`${o.nom} : ${o.simuRequis-(o.simuFaits||0)} simu(s) d'entraînement ciblé à faire`, s:o.motif||""});
  });
  // collège passage CDB et QT ATR
  ev().forEach(o=>{ if (!evalsDone(o)) return; const p = registry().find(x=>sameP(x, o.nom, o.matricule)); if (p && isOut(p)) return;
    const c = o.college||{}, cd = c.date||COLLEGE_DATE;
    if (!c.resultat && cd < T0) A.push({k:"warn", v:"pilotes", t:`${o.nom} : résultat du collège à saisir`, s:`Collège du ${frDate(cd)}`});
    if (c.resultat==="Admis" && c.qtDate && c.qtDate <= T0) A.push({k:"info", v:"pilotes", t:`${o.nom} : parti en QT ATR le ${frDate(c.qtDate)}`, s:"Le retirer du secteur depuis sa fiche"}); });
  // même TRI deux fois
  const triOf = n => TRI().find(t=>norm(n).startsWith(norm(t))) || surname(n);
  ev().forEach(o=>{
    const V = volsRows().filter(x=>x.code==="v" && (x.stagiaire.id===o.matricule || surname(x.stagiaire.nom)===surname(o.nom)));
    const by = {}; V.forEach(x=>(by[triOf(x.instr.nom)] = by[triOf(x.instr.nom)] || []).push(x.date));
    Object.entries(by).forEach(([t,ds])=>{ const u=[...new Set(ds)].sort(); if (u.some((d,i)=>i>0 && d>addDays(u[i-1],1)))
      A.push({k:"crit", v:"evals", t:`${o.nom} : 2 vols d'éval avec ${t}`, s:`Interdit (${u.map(frDate).join(", ")}). Refaire un des vols avec un autre TRI.`}); });
  });
  // checks PL / dossiers
  ev().filter(o=>!inEval(o)).forEach(o=>{
    ["checkLocal","checkNav"].forEach(f=>{ const m = /Prévu le (\d\d)\/(\d\d)/.exec(o[f]||""); if (m && "2026-"+m[2]+"-"+m[1] < T0) A.push({k:"warn", v:"pl", t:`${o.nom} : ${f==="checkLocal"?"check local":"check nav"} ${o[f].toLowerCase()}`, s:"Résultat à mettre à jour"}); });
    if (o.checkLocal==="Instruction PL" && ((o.plHeures||0) >= r.plHeures || (o.plEtapes||0) >= r.plEtapes) && !o.dossier) A.push({k:"warn", v:"pl", t:`${o.nom} : instruction PL terminée`, s:"Dossier à ramener à la formation pour désignation"});
  });
  // lâcher
  lacherList().forEach(p=>{
    if (p.lache && daysTo(p.lache)>=-2) A.push({k:"warn", v:"lacher", t:`${p.nom} lâché ${p.lache===T0?"aujourd'hui":"le "+frDate(p.lache)}`, s:"Ab initio : moins de "+r.initHeures+" h, jamais avec un autre ab initio. Penser au dossier."});
    if (p.lache) return; const L = legsOf(p);
    if (p.cl && (p.cl.faits||0) >= (p.cl.requis||2)) A.push({k:"crit", v:"lacher", t:`${p.nom} : check line terminé`, s:"À déclarer lâché (bouton Lâché → ab initio)"});
    if (L >= r.legsAlerte) A.push({k:"crit", v:"lacher", t:`${p.nom} : ${L} legs sur ${r.legsLacher}`, s: L>=r.legsLacher?"Check Line à programmer":"Alarme 36 legs : suivre de près et programmer le contrôle"});
    legsSansSafety(p).forEach(v=>A.push({k:"crit", v:"lacher", t:`${p.nom} : vol du ${frDate(v.date)} sans safety pilot`, s:`Les ${r.legsSafety} premiers legs exigent un safety pilot de la liste`}));
  });
  // initiation
  Object.entries(st.init).forEach(([id,p])=>{ if ((p.heures||0) >= r.initHeures) A.push({k:"info", v:"init", t:`${p.nom} : ${p.heures} h, fin de période ab initio`, s:"Peut sortir de la liste ab initio"}); });
  // simu
  allSlots().filter(s=>s.date>=T0 && s.date<=addDays(T0,14) && isEmptySlot(s)).forEach(s=>A.push({k: daysTo(s.date)<=3?"crit":"warn", v:"simu", t:`Simu ${dayLabel(s.date)} S${s.s} : TRI à trouver`, s:s.crew}));
  const nlog = Object.values(st.simulog).filter(l=>!l.notifie).length;
  if (nlog) A.push({k:"warn", v:"simu", t:`${nlog} changement${nlog>1?"s":""} simu à notifier au CSV Kouba`, s:"Message prêt à copier dans l'onglet Simu"});
  // validités
  validList().forEach(p=>Object.entries(p.items||{}).forEach(([t,d])=>{ const lv = cellLevel(d); if (lv==="crit"||lv==="warn") A.push({k:lv, v:"valid", t:`${p.nom} : ${t} ${lv==="crit"?"expiré":"expire"} le ${frDate(d)}`, s: lv==="crit"?"À reprogrammer":"Moins de 30 jours"}); }));
  const nl = lics().filter(x=>licStatus(x).k==="crit").length;
  if (nl) A.push({k:"warn", v:"equipes", t:`${nl} licences échues à faire renouveler`, s:"État de suivi du 30/08/2026"});
  // MAX
  Object.values(st.max).forEach(p=>{ if (p.licenceOk && (!p.suiviInforme || !p.progInforme)) A.push({k:"warn", v:"max", t:`${p.nom} : licence MAX prête`, s:`Informer ${[!p.suiviInforme&&"le suivi des licences",!p.progInforme&&"la conception programme"].filter(Boolean).join(" et ")}`}); });
  // rappels
  memos().filter(m=>!m.fait && m.echeance && daysTo(m.echeance)<=7).forEach(m=>A.push({k:memoLevel(m), v:"memos", t:m.texte, s:`${m.source?m.source+" · ":""}${frDate(m.echeance)} (${jx(daysTo(m.echeance))})`}));
  events().forEach(e=>{ const n = daysTo(e.date), open = (e.objectifs||[]).filter(o=>!o.fait).length; if (n>=0 && n<=30 && open) A.push({k:n<=7?"crit":"warn", v:"events", t:`${e.nom} : ${jx(n)}`, s:`${open} objectif${open>1?"s":""} non atteint${open>1?"s":""}`}); });
  // lâchés récents
  trainees().filter(t=>t.lache && t.lache>=addDays(T0,-7)).forEach(t=>A.push({k:"info", v:"vols", t:`${t.nom} lâché le ${frDate(t.lache)}`, s:"Clôturer son dossier et l'ajouter en ab initio"}));
  const o = {crit:0,warn:1,info:2,ok:3};
  return A.sort((a,b)=>o[a.k]-o[b.k]);
}

/* ---------- annuaire pilotes + fiche ---------- */
const PREFIX = ["EL","AIT","BEN","OULD","SABER","HADJ","AHMED","NAIT","SAID","BRAHAM","LABBACI"];
function nameKey(n){
  const w = norm(n).split(" ").filter(Boolean); if (!w.length) return "";
  let i = 1; let sn = w[0];
  if (PREFIX.includes(w[0]) && w.length>2) { sn = w[0]+" "+w[1]; i = 2; }
  return sn + "|" + (w[i]||"").slice(0,3);
}
const keySur = k => k.split("|")[0];
function sameP(p, nom, mat){
  if (mat && p.mat && String(mat)===String(p.mat)) return true;
  if (!nom) return false;
  const a = nameKey(p.nom), b = nameKey(nom);
  if (a===b) return true;
  // un seul nom de famille d'un côté (ex. "Miloudi") : on accepte si le nom est unique dans l'annuaire
  if (keySur(a)===keySur(b) && (!a.split("|")[1] || !b.split("|")[1])) return (surCount()[keySur(a)]||0) <= 1;
  return false;
}
let _reg = null, _regSig = "";
function registry(){
  const sig = [st.ref.pilotes, st.instr, st.init, st.opl, st.max, st.valid, st.vols].map(x=>x?Object.keys(x).length:0).join(",") + JSON.stringify(Object.values(st.instr).map(x=>x.nom)) + ((st.ref.pilotes&&st.ref.pilotes.rows||[]).length) + Object.entries(st.fiches).map(([k,f])=>k+(f.fonction||"")).join();
  if (_reg && sig===_regSig) return _reg;
  const rows = ((st.ref.pilotes&&st.ref.pilotes.rows)||[]).map(p=>({...p}));
  const have = (nom, mat) => rows.find(p=>(mat && p.mat && String(mat)===String(p.mat)) || nameKey(p.nom)===nameKey(nom));
  const addV = (nom, mat, fonction) => { if (!nom || have(nom, mat)) return; rows.push({id:(mat||"v-"+norm(nom).toLowerCase().replace(/[^a-z0-9]+/g,"-")), nom, mat:mat||"", fonction:fonction||"", virtuel:true}); };
  Object.values(st.opl).forEach(o=>addV(o.nom, o.matricule, "FO"));
  Object.values(st.instr).forEach(o=>addV(o.nom, o.mat, o.pos));
  Object.values(st.init).forEach(o=>addV(o.nom, o.mat, o.pos));
  Object.values(st.max).forEach(o=>addV(o.nom, o.mat, o.pos));
  Object.values(st.valid).forEach(o=>addV(o.nom, o.mat, o.fonction));
  rows.forEach(p=>{ const f = st.fiches[p.id]; if (f && f.fonction) p.fonction = f.fonction; });
  rows.sort((a,b)=>norm(a.nom).localeCompare(norm(b.nom)));
  _reg = rows; _regSig = sig; _sur = null; return rows;
}
let _sur = null;
function surCount(){ if (_sur) return _sur; _sur = {}; (_reg||[]).forEach(p=>{ const s = keySur(nameKey(p.nom)); _sur[s]=(_sur[s]||0)+1; }); return _sur; }
const pilotById = id => registry().find(p=>p.id===id);

function textHas(text, p){
  const t = " "+norm(text)+" ", s = keySur(nameKey(p.nom)); if (!s) return false;
  const i = t.indexOf(" "+s+" "); if (i<0) return false;
  if ((surCount()[s]||0) <= 1) return true;
  const after = t.slice(i+s.length+2).split(" ")[0]||"", first = (norm(p.nom).split(" ")[s.split(" ").length]||"");
  return !!after && !!first && first.startsWith(after.slice(0,1)) && (after.length<3 || first.startsWith(after.slice(0,3)));
}
function simuFor(p){
  const S = allSlots().filter(s=>textHas(s.crew,p) || textHas(s.instr,p));
  const past = S.filter(s=>s.date<T0), fut = S.filter(s=>s.date>=T0);
  return {last: past[past.length-1], next: fut[0], asTri: S.filter(s=>textHas(s.instr,p)).length, all:S};
}
function pilotInfo(p){
  const find = (obj, fn) => Object.entries(obj).map(([id,d])=>({id,...d})).find(fn);
  const opl = Object.values(st.opl).find(o=>sameP(p, o.nom, o.matricule));
  const instr = find(st.instr, o=>sameP(p, o.nom, o.mat));
  const init = find(st.init, o=>sameP(p, o.nom, o.mat));
  const max = find(st.max, o=>sameP(p, o.nom, o.mat));
  const valid = find(st.valid, o=>sameP(p, o.nom, o.mat));
  const lic = lics().find(r=>sameP(p, r.nom, ""));
  const safety = ((st.ref.equipes&&st.ref.equipes.safety)||[]).some(x=>sameP(p, x.nom, x.mat));
  const cand = ((st.ref.equipes&&st.ref.equipes.candidatsTRI)||[]).find(x=>sameP(p, x.nom, ""));
  const evaluateur = TRI().some(t=>sameP(p, t, ""));
  const tre = ((st.ref.tri&&st.ref.tri.tre)||[]).some(t=>sameP(p, t, ""));
  const tri = evaluateur || tre || ((st.ref.tri&&st.ref.tri.secteur)||[]).some(t=>sameP(p, t, ""));
  const tr = trainees().find(t=>sameP(p, t.nom, t.id));
  return {opl, instr, init, max, valid, lic, safety, cand, evaluateur, tri, tre, tr};
}
const isOut = p => !!(st.fiches[p.id] && st.fiches[p.id].sorti);
const activeReg = () => registry().filter(p=>!isOut(p));
const COLLEGE_DATE = "2026-11-16";
const evalsDone = o => o && inEval(o) && (o.evalsRestantes||0)===0 && o.groupe!=="CIBLE";
function pilotStatus(p, I){
  if (isOut(p)) { const so = st.fiches[p.id].sorti; return {t:`SORTI · ${so.motif||""}`.toUpperCase(), c:"c-dim", phase:"sorti"}; }
  I = I || pilotInfo(p); const r = R();
  if (evalsDone(I.opl)) { const c = I.opl.college||{};
    if (c.resultat==="Admis") return {t:"ADMIS CDB · QT ATR", c:"c-grn", phase:"qt"};
    if (c.resultat==="Ajourné") return {t:"AJOURNÉ AU COLLÈGE", c:"c-amb", phase:"college"};
    return {t:"COLLÈGE CDB "+frDate(c.date||COLLEGE_DATE).slice(0,5), c:"c-mag", phase:"college"}; }
  if (I.instr && !I.instr.lache) { const L = legsOf(I.instr); return {t:`INSTR LIGNE ${L}/${r.legsLacher}`, c: L>=r.legsAlerte?"c-red":(L>=r.legsAlerte-6?"c-amb":"c-mag"), phase:"instr"}; }
  if (I.init && (I.init.heures||0) < r.initHeures) return {t:`AB INITIO ${I.init.heures||0}H`, c:"c-amb", phase:"init"};
  if (I.opl && inEval(I.opl) && (I.opl.evalsRestantes||0)>0) return {t:`${(I.opl.groupe||"OPL")==="CDB"?"EVAL CDB":(I.opl.groupe==="CIBLE"?"CIBLÉ":"EVAL")} ${faits(I.opl)}/${I.opl.total||r.evalsStd}`, c: evLevel(I.opl)==="crit"?"c-red":"c-mag", phase:"eval"};
  if (I.opl && !inEval(I.opl)) { if (I.opl.checkLocal==="Instruction PL") return {t:"INSTR PL", c:"c-mag", phase:"pl"};
    const pl = chkPending(I.opl.checkLocal), pn = chkPending(I.opl.checkNav);
    return {t: pl&&pn?"CHECK LOCAL + NAV":pl?"CHECK LOCAL":pn?"CHECK NAV":"CHECKS VALIDÉS", c: pl||pn?"c-mag":"c-grn", phase:"checks"}; }
  if (I.max && !I.max.licenceOk) return {t:"FORMATION MAX", c:"c-cyn", phase:"max"};
  return {t: I.tri?"TRI":"EN LIGNE", c: I.tri?"c-cyn":"c-grn", phase:"ligne"};
}

/* affectations depuis la fiche */
async function assign(p, what){
  const I = pilotInfo(p), mat = p.mat || "", key = mat || p.id;
  const fn = p.fonction || "";
  const base = {nom:p.nom, matricule:key, ordre:200+Object.keys(st.opl).length};
  if (what==="instr") { if (I.instr) return go("lacher"); await add("instr", {nom:p.nom, mat, pos:fn==="CPT"?"CPT":"FO", legsInit:0, vols:[], preControle:"", cl:{requis:2,faits:0}, lache:""}, "Affecté en instruction ligne"); return; }
  if (what==="init") { if (I.init) return go("init"); return put("init/"+key, {nom:p.nom, mat, pos:fn||"FO", heures:0, lacheLe:T0}, "Affecté en ab initio"); }
  if (what==="pl") { if (I.opl) return upd("opl/"+I.opl.matricule, {checkLocal:"Instruction PL", checkNav:"Instruction PL", evalsRestantes:null}, "Passé en instruction PL");
    return put("opl/"+key, {...base, checkLocal:"Instruction PL", checkNav:"Instruction PL", plHeures:0, plEtapes:0, exclus:[], programmes:[]}, "Affecté en instruction PL"); }
  if (what==="local" || what==="nav") { const f = what==="local"?"checkLocal":"checkNav", g = what==="local"?"checkNav":"checkLocal", lbl = what==="local"?"Affecté au check local":"Affecté au check nav";
    if (I.opl) { const o = I.opl, other = o[g]==="Instruction PL" ? "" : (inEval(o) ? "" : (o[g]||""));
      return upd("opl/"+o.matricule, {[f]:"En attente", [f+"Date"]:"", [g]:other, evalsRestantes:null}, lbl); }
    return put("opl/"+key, {...base, [f]:"En attente", [g]:"", exclus:[], programmes:[]}, lbl); }
  if (what==="checks") { if (I.opl) return upd("opl/"+I.opl.matricule, {checkLocal:"En attente", checkNav:"En attente", evalsRestantes:null}, "Affecté aux checks");
    return put("opl/"+key, {...base, checkLocal:"En attente", checkNav:"En attente", exclus:[], programmes:[]}, "Affecté aux checks"); }
  if (what==="OPL" || what==="CDB" || what==="CIBLE") {
    const tot = R().evalsStd, data = {groupe:what, total:tot, evalsRestantes: I.opl && inEval(I.opl) ? I.opl.evalsRestantes : tot, echeance: what==="CDB"?"2026-11-16":addDays(T0,30), checkLocal:"Validé", checkNav:"Validé"};
    if (what==="CIBLE") Object.assign(data, {simuRequis:2, simuFaits:0, motif:"Approche instable"});
    if (I.opl) return upd("opl/"+I.opl.matricule, data, "Affecté aux évaluations");
    return put("opl/"+key, {...base, ...data, exclus:[], programmes:[]}, "Affecté aux évaluations"); }
  if (what==="max") { if (I.max) return go("max"); return add("max", {nom:p.nom, mat, pos:fn||"", etape:"", licenceOk:false, suiviInforme:false, progInforme:false}, "Affecté à la formation MAX"); }
  if (what==="valid") { if (I.valid) return go("valid"); return put("valid/"+key, {nom:p.nom, mat, fonction:fn, items:{}}, "Ajouté au suivi des validités"); }
  if (what==="qtri" || what==="qtre" || what==="qeval") return setQualif(p, what, true);
  if (what==="safety") { const E = st.ref.equipes||{}; const S = (E.safety||[]).slice();
    const i = S.findIndex(x=>sameP(p, x.nom, x.mat)); if (i>=0) S.splice(i,1); else S.push({mat, nom:p.nom});
    return upd("ref/equipes", {safety:S}, i>=0?"Retiré des safety pilots":"Ajouté aux safety pilots"); }
}

function vPilotes(){
  const q = norm(F("pQ","")), f = F("pF","tous"), reg = f==="sortis" ? registry().filter(isOut) : activeReg();
  const L = reg.map(p=>({p, I:pilotInfo(p)})).map(x=>({...x, s:pilotStatus(x.p, x.I)}))
    .filter(x=>!q || norm(x.p.nom).includes(q) || String(x.p.mat).includes(q))
    .filter(x=> f==="tous" || (f==="suivi" ? x.s.phase!=="ligne" : f==="cpt" ? x.p.fonction==="CPT" : f==="fo" ? x.p.fonction==="FO" : f==="safety" ? x.I.safety : f==="tri" ? x.I.tri : f==="college" ? (x.s.phase==="college"||x.s.phase==="qt") : true));
  const cnt = () => activeReg().filter(p=>pilotStatus(p).phase!=="ligne").length;
  const nCol = activeReg().filter(p=>["college","qt"].includes(pilotStatus(p).phase)).length, nOut = registry().filter(isOut).length;
  return `<section class="du cdu"><div class="du-t">Pilotes <span>${activeReg().length} dans le secteur</span></div>
    <div class="sp"><b>NOM</b><input type="search" id="pQ" placeholder="Nom ou matricule" value="${esc(F("pQ",""))}" autocomplete="off"></div>
    <div class="seg">${[["tous","Tous"],["suivi",`Suivis (${cnt()})`],["cpt","CPT"],["fo","FO"],["safety","Safety"],["tri","TRI"],["college",`Collège / QT (${nCol})`],["sortis",`Sortis (${nOut})`]].map(([k,l])=>`<button data-fset="pF" data-val="${k}" aria-pressed="${k===f}">${l}</button>`).join("")}</div>
    <div>${L.slice(0,150).map(x=>lskRow(x.p, x.s)).join("") || `<div class="empty-state">Aucun pilote. Ajoute-le ci-dessous.</div>`}${L.length>150?`<div class="note">${L.length-150} autres : affine la recherche.</div>`:""}</div>
    <form class="form" data-form="newpilot"><input type="text" id="npNom" class="grow" placeholder="NOM Prénom" required><input type="text" id="npMat" placeholder="Matricule" style="width:110px"><select id="npFn"><option>FO</option><option>CPT</option></select><button class="b pri" type="submit">Ajouter</button></form>
    <div class="note">${esc((st.ref.pilotes&&st.ref.pilotes.source)||"Envoie-moi la liste complète des pilotes du secteur.")}</div></section>`;
}
function lskRow(p, s){
  s = s || pilotStatus(p);
  return `<button class="lsk" data-pilot="${esc(p.id)}"><span class="k"></span><span class="n">${esc(p.nom)}<small>${esc(p.fonction||"—")} · ${esc(p.mat||"sans matricule")}</small></span><span class="s ${s.c}">${esc(s.t)} ▸</span></button>`;
}

/* qualifications instructeur : listes de ref/tri (secteur = tous les TRI, tre, evaluateurs) */
async function setQualif(p, what, on){
  const T = {...(st.ref.tri||{})};
  const lists = {qtri:"secteur", qtre:"tre", qeval:"evaluateurs"};
  const keyL = lists[what];
  const surnameCap = n => { const w = norm(n).split(" "); const sn = PREFIX.includes(w[0]) && w.length>2 ? w[0]+" "+w[1] : w[0]; return sn.charAt(0)+sn.slice(1).toLowerCase(); };
  const label = {qtri:"TRI", qtre:"TRE", qeval:"évaluateur"}[what];
  const patch = {};
  const edit = (k, add) => { let L = (T[k]||[]).slice(); L = L.filter(x=>!sameP(p, x, "")); if (add) L.push(k==="evaluateurs" ? surnameCap(p.nom) : p.nom); patch[k] = L; T[k] = L; };
  edit(keyL, on);
  if (on && what!=="qtri") edit("secteur", true);          // un TRE ou un évaluateur est aussi TRI
  if (!on && what==="qtri") { edit("tre", false); edit("evaluateurs", false); }  // plus TRI : plus TRE ni évaluateur
  return upd("ref/tri", patch, on ? `${p.nom} : ${label} ajouté` : `${p.nom} : ${label} retiré`);
}

/* retrait d'une affectation */
async function unassign(p, what){
  const I = pilotInfo(p);
  if (what==="instr" && I.instr) return del("instr/"+I.instr.id, "Retiré de l'instruction ligne");
  if (what==="init" && I.init) return del("init/"+I.init.id, "Retiré des ab initio");
  if (what==="max" && I.max) return del("max/"+I.max.id, "Retiré de la formation MAX");
  if (what==="valid" && I.valid) return del("valid/"+I.valid.id, "Retiré du suivi des validités");
  if (what==="safety") return assign(p, "safety");
  if (what==="qtri" || what==="qtre" || what==="qeval") return setQualif(p, what, false);
  if ((what==="local" || what==="nav") && I.opl) { const f = what==="local"?"checkLocal":"checkNav", g = what==="local"?"checkNav":"checkLocal";
    if (!(I.opl[g]||"") && !(I.opl.programmes||[]).length) return del("opl/"+I.opl.matricule, "Affectation retirée");
    return upd("opl/"+I.opl.matricule, {[f]:"", [f+"Date"]:""}, what==="local"?"Retiré du check local":"Retiré du check nav"); }
  if (["pl","checks","OPL","CDB","CIBLE"].includes(what) && I.opl) return del("opl/"+I.opl.matricule, "Affectation retirée");
}
const chkPending = v => !!v && v!=="Validé" && v!=="Instruction PL";
const chkOn = v => !!v && v!=="Instruction PL";
function oplState(o){ if (!o) return ""; if (inEval(o)) return o.groupe||"OPL"; return o.checkLocal==="Instruction PL" ? "pl" : "checks"; }

/* champ de saisie directe sur la fiche */
function fld(label, field, type, value, hint, cls){
  return `<label class="fld ${cls||""}"><span>${label}</span><input type="${type}" ${type==="number"?'min="0" inputmode="numeric"':""} data-ff="${field}" value="${esc(value??"")}" aria-label="${label}">${hint?`<small>${hint}</small>`:""}</label>`;
}

function vFiche(){
  const p = pilotById(ui.pid); if (!p) return `<div class="empty-state">Pilote introuvable. Reviens au panneau et cherche-le à nouveau.</div>`;
  const I = pilotInfo(p), r = R(), s = pilotStatus(p, I), sim = simuFor(p), fx = st.fiches[p.id] || {};
  const o = I.opl, ins = I.instr, os = oplState(o);
  /* parcours */
  const upg = !!o;
  const steps = upg ? [["pl","Instr. PL"],["local","Check local"],["nav","Check nav"],["eval","Évals"],["college","Collège CDB"],["qt","QT ATR"]]
                    : [["instr","Instr. ligne"],["lache","Lâché"],["init","Ab initio"],["ligne","En ligne"]];
  const order = upg ? {pl:0, checks:1, eval:3, college:4, qt:5, sorti:6, ligne:6} : {instr:0, init:2, ligne:3, max:3, sorti:4};
  const cur = order[s.phase] ?? steps.length;
  const stepCls = (k,i) => {
    if (k==="college" && o && o.college && o.college.resultat==="Ajourné") return "act";
    if (s.phase==="checks" && (k==="local"||k==="nav")) { const v = o[k==="local"?"checkLocal":"checkNav"]; return v==="Validé"?"done":(chkPending(v)?"act":""); }
    return i===cur?"act":(i<cur?"done":""); };
  /* valeurs auto (planning) et saisies */
  const autoLast = sim.last ? sim.last.date : "", autoNext = sim.next ? sim.next.date : "";
  const cl = I.valid && I.valid.items && I.valid.items.CL || "";
  const licIso = fx.licence || (I.lic ? frToIso(I.lic.validite) : "");
  const L = ins ? legsOf(ins) : 0;
  const lv = d => { const k = cellLevel(d); return k==="crit"?"crit":k==="warn"?"warn":""; };
  const sw = (k, label, on, detail) => {
    const ask = ui.form["un"+k];
    return `<div class="swr ${on?"on":""}">
      <div class="txt"><b>${label}</b>${detail?`<div class="sub">${detail}</div>`:""}</div>
      ${ask?`<div class="row"><button class="b sm crb" data-unassign="${k}" data-pid="${esc(p.id)}">Retirer</button><button class="b sm" data-closeform="un${k}">Garder</button></div>`
        :`<button class="tog" role="switch" aria-checked="${on}" aria-label="${label}" data-tog="${k}" data-on="${on?1:""}" data-pid="${esc(p.id)}"><i></i></button>`}
    </div>`;
  };
  const evDetail = g => o && os===g ? `${faits(o)}/${o.total||r.evalsStd} évals${o.echeance?" · avant le "+frDate(o.echeance):""}` : "";
  return `
  <section class="du"><div class="du-t">Fiche pilote <span>${esc(p.fonction||"")} · ${esc(p.mat||"sans matricule")}</span></div>
    <div class="idn"><div class="nm">${esc(p.nom)}</div><div class="pill ${s.c==="c-red"?"crit":s.c==="c-amb"?"warn":s.c==="c-grn"?"ok":"mag"}">${esc(s.t)}</div></div>
    <div class="row">${[I.safety&&`<span class="pill ok">Safety pilot</span>`, I.evaluateur&&`<span class="pill info">TRI évaluateur</span>`, (I.tri&&!I.evaluateur)&&`<span class="pill info">TRI</span>`, I.tre&&`<span class="pill info">TRE</span>`, I.cand&&`<span class="pill mag">Candidat TRI</span>`].filter(Boolean).join(" ")}</div>
    <div class="fma">${steps.map(([k,l],i)=>`<div class="${stepCls(k,i)}">${l}</div>`).join("")}</div>
    ${I.init && (I.init.heures||0) < r.initHeures?`<div class="item warn"><div class="txt"><b>Ab initio</b><div class="sub">Ne vole jamais avec un autre ab initio.</div></div></div>`:""}
  </section>

  <section class="du"><div class="du-t">Données <span>touche une case pour modifier</span></div>
    <div class="flds">
      ${fld("Dernier simu","dernierSimu","date", fx.dernierSimu||autoLast, !fx.dernierSimu&&autoLast?"d'après le planning":"")}
      ${fld("Prochain simu","prochainSimu","date", fx.prochainSimu||autoNext, !fx.prochainSimu&&autoNext?`planning : S${sim.next.s} ${esc(sim.next.instr||"TRI ?")}`:"")}
      ${fld("Line check (expire le)","lineCheck","date", cl, cl&&cellLevel(cl)==="crit"?"expiré":"", lv(cl))}
      ${fld("Licence (valide jusqu'au)","licence","date", licIso, "", lv(licIso))}
      ${ins?fld(`Legs (sur ${r.legsLacher})`,"legs","number", L, L>=r.legsAlerte?"alarme 36 legs":"", L>=r.legsAlerte?"crit":""):""}
      ${I.init?fld(`Heures ab initio (sur ${r.initHeures})`,"heures","number", I.init.heures||0, ""):""}
      ${o&&inEval(o)?fld(`Évals faites (sur ${o.total||r.evalsStd})`,"evalsFaites","number", faits(o), ""):""}
      ${o&&os==="pl"?fld(`Heures PL (sur ${r.plHeures})`,"plHeures","number", o.plHeures||0, ""):""}
      ${o&&os==="pl"?fld(`Étapes PL (sur ${r.plEtapes})`,"plEtapes","number", o.plEtapes||0, ""):""}
    </div>
    ${o&&os==="checks"?`<div class="list">${[["checkLocal","Check local (vol local)"],["checkNav","Check nav"]].filter(([f])=>chkOn(o[f])).map(([f,l])=>{ const v = o[f]||"En attente", ok = v==="Validé", dt = o[f+"Date"];
      return `<div class="item ${ok?"ok":"warn"}"><div class="txt"><b>${l}</b><div class="sub">${ok?"Validé"+(dt?" le "+frDate(dt):""):esc(v)}</div></div>
      ${ok?`<button class="b sm" data-chk="${o.matricule}" data-f="${f}" data-undo="1">Annuler</button>`:`<input type="date" id="cd-${f}" value="${T0}" aria-label="Date du ${l}"><button class="b sm okb" data-chk="${o.matricule}" data-f="${f}">Valider</button>`}</div>`;}).join("")}</div>

/* enregistrement d'un champ de la fiche */
async function saveField(p, f, value){
  const I = pilotInfo(p), r = R(), key = p.mat || p.id;
  if (["dernierSimu","prochainSimu","licence","note","fonction"].includes(f)) return put("fiches/"+p.id, {...(st.fiches[p.id]||{}), [f]:value}, "Enregistré");
  if (f==="lineCheck") { if (I.valid) return upd("valid/"+I.valid.id, {items:{...(I.valid.items||{}), CL:value}}, "Line check enregistré");
    return put("valid/"+key, {nom:p.nom, mat:p.mat||"", fonction:p.fonction||"", items:{CL:value}}, "Line check enregistré"); }
  const n = Math.max(0, +value||0);
  if (f==="legs" && I.instr) { const vl = (I.instr.vols||[]).reduce((a,v)=>a+(+v.legs||0),0); return upd("instr/"+I.instr.id, {legsInit: Math.max(0, n - vl)}, "Legs enregistrés"); }
  if (f==="heures" && I.init) return upd("init/"+I.init.id, {heures:n}, "Heures enregistrées");
  if (f==="evalsFaites" && I.opl) { const tot = I.opl.total||r.evalsStd; return upd("opl/"+I.opl.matricule, {evalsRestantes: Math.max(0, tot - Math.min(n, tot))}, "Évals enregistrées"); }
  if ((f==="plHeures"||f==="plEtapes") && I.opl) return upd("opl/"+I.opl.matricule, {[f]:n}, "Enregistré");
}

function vMemos(){

  const L = all.filter(m=>src==="Tous"||m.source===src).filter(m=>cat==="tout"||(m.cat||"pro")===cat);
  const groups = [["En retard", m=>!m.fait && m.echeance && m.echeance<T0],["Cette semaine", m=>!m.fait && ((m.echeance && m.echeance>=T0 && daysTo(m.echeance)<=7) || (!m.echeance && m.horizon==="semaine"))],
    ["Ce mois", m=>!m.fait && ((m.echeance && daysTo(m.echeance)>7 && daysTo(m.echeance)<=31) || (!m.echeance && m.horizon==="mois"))],
    ["Cette année", m=>!m.fait && ((m.echeance && daysTo(m.echeance)>31) || (!m.echeance && m.horizon==="annee"))],
    ["Sans date", m=>!m.fait && !m.echeance && !m.horizon],["Fait", m=>m.fait]];
  const row = m => `<div class="item ${memoLevel(m)}"><input type="checkbox" data-memo="${m.id}" ${m.fait?"checked":""} aria-label="Fait">
    <div class="txt"><div style="${m.fait?"text-decoration:line-through;color:var(--muted)":""}">${esc(m.texte)}</div>
    <div class="sub">${[m.source&&m.source!=="Moi"?"Demandé par "+m.source:"", m.cat==="projet"?"Projet perso":"", m.echeance?"Butoir "+frDate(m.echeance)+" ("+jx(daysTo(m.echeance))+")":""].filter(Boolean).map(esc).join(" · ")}</div></div>
    <button class="b sm" data-delmemo="${m.id}" aria-label="Supprimer">✕</button></div>`;
  return `${quickMemo()}
  <div class="row"><span class="note">Demandé par</span><div class="seg">${["Tous",...SOURCES].map(s=>`<button data-fset="mSrcF" data-val="${s}" aria-pressed="${s===src}">${s}</button>`).join("")}</div></div>
  <div class="seg">${[["tout","Tout"],["pro","Travail"],["projet","Projets perso"]].map(([k,l])=>`<button data-fset="mCatF" data-val="${k}" aria-pressed="${k===cat}">${l}</button>`).join("")}</div>
  ${groups.map(([g,fn])=>{ const X = L.filter(fn).sort((a,b)=>String(a.echeance||"9").localeCompare(String(b.echeance||"9"))); return X.length?`<section class="list"><h2>${g} (${X.length})</h2>${X.map(row).join("")}</section>`:""; }).join("") || `<div class="empty-state">Aucun mémo. Écris ici tout ce qui te passe par la tête : je te le rappelle sur le panneau dès que la date butoir approche.</div>`}`;
}

/* --- Lâcher en ligne --- */
function gauge(L){
  const r = R(), max = r.legsLacher, k = L>=r.legsAlerte?"crit":(L>=r.legsAlerte-6?"warn":"");
  const pos = n => (Math.min(n,max)/max*100).toFixed(1)+"%";
  return `<div class="gauge ${k}"><i style="width:${pos(L)}"></i><u style="left:${pos(r.legsSafety)}"></u><u style="left:${pos(r.legsAlerte)}"></u></div>
  <div class="gscale"><span>0</span><span>safety ${r.legsSafety}</span><span>alarme ${r.legsAlerte}</span><span>${max} legs</span></div>`;
}

const TITLES = {...Object.fromEntries(MODULES.map(([id,c])=>[id,c])), fiche:"Fiche pilote"};
function render(){

  $("#back").hidden = ui.view==="home";
  $("#ttl").textContent = ui.view==="home" ? "FTM Desk" : (TITLES[ui.view]||"");
  if (st.dbFailed) { $("#view").innerHTML = `<div class="empty-state">Ouvre cette page depuis claude.ai, connecté à ton compte, pour voir et modifier tes données.</div>`; return; }
  if (!all) return;
  const AL = alerts(), nw = AL.filter(x=>x.k==="crit").length, nc = AL.filter(x=>x.k==="warn").length;
  $("#mw").classList.toggle("on", nw>0); $("#mc").classList.toggle("on", nc>0); $("#mwn").textContent = nw; $("#mcn").textContent = nc;
  const a = document.activeElement, fid = a && a.id, pos = fid && a.selectionStart;
  if (a && a.tagName==="TEXTAREA") return;  // ne pas écraser une saisie longue en cours
  $("#view").innerHTML = ({home:vHome, pilotes:vPilotes, fiche:vFiche, memos:vMemos, events:vEvents, lacher:vLacher, init:vInit, pl:vPL, evals:vEvals, simu:vSimu, valid:vValid, max:vMax, equipes:vEquipes, vols:vVols, dim:vDim, moi:vMoi, regles:vRegles}[ui.view]||vHome)();
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); try{ if(pos!=null) el.setSelectionRange(pos,pos);}catch(e){} } }
}
function go(v){ ui.view=v; ui.form={}; try{localStorage.setItem("ftm.view",v);}catch(e){} render(); window.scrollTo(0,0); }
$("#back").addEventListener("click", ()=>go(ui.view==="fiche" && ui.from ? ui.from : "home"));
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function isDark(){ const t = document.documentElement.dataset.theme; return t ? t==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
function paintTheme(){ $("#themeBtn").innerHTML = isDark() ? SUN : MOON; $("#themeBtn").setAttribute("aria-label", isDark()?"Passer en mode jour":"Passer en mode nuit"); }
try { const t = localStorage.getItem("ftm.theme"); if (t) document.documentElement.dataset.theme = t; } catch(e) {}
paintTheme();
$("#themeBtn").addEventListener("click", ()=>{ const t = isDark() ? "light" : "dark"; document.documentElement.dataset.theme = t; try{ localStorage.setItem("ftm.theme", t); }catch(e){} paintTheme(); });
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintTheme); } catch(e) {}
$("#mw").addEventListener("click", ()=>go("home")); $("#mc").addEventListener("click", ()=>go("home"));
function openPilot(id){ ui.from = ui.view==="fiche" ? ui.from : ui.view; ui.pid = id; try{ localStorage.setItem("ftm.pid", id); }catch(e){} go("fiche"); }

const V = $("#view");
const val = id => (document.getElementById(id)||{}).value;
V.addEventListener("click", async e=>{
  const t = e.target.closest("button"); if (!t) return; const d = t.dataset;
  if (d.go) return go(d.go);
  if (d.pilot) return openPilot(d.pilot);
  if (d.export && st.db.exportAll) { const blob = new Blob([JSON.stringify(st.db.exportAll(), null, 1)], {type:"application/json"}); const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "ftm-desk-sauvegarde-"+T0+".json"; document.body.appendChild(a); a.click(); a.remove(); return toast("Sauvegarde exportée"); }
  if (d.colres!=null && d.m) { const o = st.opl[d.m]; return upd("opl/"+d.m, {college:{...(o.college||{date:COLLEGE_DATE}), resultat:d.colres}}, d.colres?"Résultat du collège : "+d.colres:"Résultat effacé"); }
  if (d.sortie!=null && d.pid) { const motif = d.sortie || val("soM"), date = d.sortie ? (d.d||T0) : (val("soD")||T0);
    return put("fiches/"+d.pid, {...(st.fiches[d.pid]||{}), sorti:{motif, date}}, "Retiré du secteur ("+motif+")"); }
  if (d.reint) return put("fiches/"+d.reint, {...(st.fiches[d.reint]||{}), sorti:null}, "Pilote réintégré");
  if (d.chk) return d.undo ? upd("opl/"+d.chk, {[d.f]:"En attente", [d.f+"Date"]:""}, "Check remis en attente")
    : upd("opl/"+d.chk, {[d.f]:"Validé", [d.f+"Date"]: val("cd-"+d.f)||T0}, (d.f==="checkNav"?"Check nav":"Check local")+" validé");
  if (d.assign) { const p = pilotById(d.pid); if (p) await assign(p, d.assign); return; }
  if (d.tog) { if (d.on) { ui.form["un"+d.tog] = true; return render(); } const p = pilotById(d.pid); if (p) await assign(p, d.tog); return; }
  if (d.unassign) { delete ui.form["un"+d.unassign]; const p = pilotById(d.pid); if (p) await unassign(p, d.unassign); return; }
  if (d.fset) { ui.f[d.fset]=d.val; return render(); }
  if (d.openform) { ui.form[d.openform]=true; return render(); }
  if (d.closeform) { delete ui.form[d.closeform]; return render(); }
  // évals
  if (d.pick) { const o = st.opl[d.pick]; ui.form[d.pick] = {tri: d.tri || triDispo(o)[0], date:""}; return render(); }
  if (d.done || d.del || d.rate) {
    const m = d.done||d.del||d.rate, o = st.opl[m]; let P = (o.programmes||[]).map(p=>({...p})); const p = P.find(x=>x.id===d.pid); if (!p) return;
    if (d.del) return upd("opl/"+m, {programmes:P.filter(x=>x.id!==d.pid)}, "Vol retiré");
    if (d.rate) { p.statut="raté"; p.cause=val("cause-"+p.id); delete ui.form["r"+p.id]; return upd("opl/"+m, {programmes:P}, "Vol raté enregistré : "+causeLabel(p.cause)); }
    p.statut="fait"; const ex = [...(o.exclus||[])]; if (!ex.some(x=>norm(x)===norm(p.tri))) ex.push(p.tri);
    return upd("opl/"+m, {programmes:P, exclus:ex, evalsRestantes:Math.max(0,(o.evalsRestantes||0)-1)}, "Vol d'éval enregistré");
  }
  if (d.simuplus) { const o = st.opl[d.simuplus]; return upd("opl/"+d.simuplus, {simuFaits:(o.simuFaits||0)+1}, "Simu comptée"); }
  if (d.toeval) return upd("opl/"+d.toeval, {evalsRestantes:R().evalsStd, total:R().evalsStd, groupe:"OPL", priorite:"mois", echeance:addDays(T0,30)}, "Passé en évaluations");
  if (d.tochecks) return upd("opl/"+d.tochecks, {checkLocal:"En attente", checkNav:"En attente"}, "Passé en checks");
  // simu
  if (d.slot) { ui.form.slot=d.slot; return render(); }
  if (d.settri) { const [m,ji,si] = d.settri.split("|"); const s = st.simu[m].jours[ji].slots[si]; delete ui.form.slot;
    return setSlot(m,+ji,+si,{instr:d.val}, `${dayLabel(st.simu[m].jours[ji].date)} S${s.s} : TRI ${s.instr||"(vide)"} → ${d.val}`); }
  if (d.swap) { const [m,ji,si] = d.swap.split("|"), [m2,ji2,si2] = d.with.split("|");
    const J = JSON.parse(JSON.stringify(st.simu[m].jours)), a = J[ji].slots[si];
    const J2 = m2===m ? J : JSON.parse(JSON.stringify(st.simu[m2].jours)), b = J2[ji2].slots[si2];
    const ai = a.instr, bi = b.instr; a.instr = bi; b.instr = ai; delete ui.form.slot;
    await upd("simu/"+m, {jours:J}); if (m2!==m) await upd("simu/"+m2, {jours:J2});
    return add("simulog", {date:T0, texte:`Permutation : ${dayLabel(J[ji].date)} S${a.s} → ${bi} ; ${dayLabel(J2[ji2].date)} S${b.s} → ${ai}`, notifie:false, cree:Date.now()}, "Permutation faite"); }
  if (d.delslot) { const [m,ji,si] = d.delslot.split("|"); const j = st.simu[m].jours[ji], s = j.slots[si]; delete ui.form.slot;
    return setSlot(m,+ji,+si,null, `${dayLabel(j.date)} S${s.s} : séance supprimée (${s.instr||"sans TRI"} · ${s.crew||""})`); }
  if (d.copy) { const txt = $("#koubaMsg").textContent; try { await navigator.clipboard.writeText(txt); toast("Mail copié"); } catch(err){ const r = document.createRange(); r.selectNodeContents($("#koubaMsg")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Texte sélectionné : copie-le"); } return; }
  if (d.notified) { const ids = Object.entries(st.simulog).filter(([,l])=>!l.notifie).map(([id])=>id); for (const id of ids) await upd("simulog/"+id, {notifie:true, notifieLe:T0}); return toast("Notifié au CSV Kouba"); }
  // lâcher
  if (d.lq) { const p = st.instr[d.lq], cl = Object.assign({requis:2,faits:0}, p.cl||{});
    if (d.act==="pre") return upd("instr/"+d.lq, {preControle: p.preControle?"":T0}, p.preControle?"Pré-contrôle annulé":"Pré-contrôle enregistré");
    if (d.act==="clreq") return upd("instr/"+d.lq, {cl:{...cl, requis: cl.requis===2?4:2}});
    if (d.act==="cl") return upd("instr/"+d.lq, {cl:{...cl, faits: Math.min(cl.requis, cl.faits+1)}}, "Étape CL enregistrée");
    if (d.act==="lache") { await upd("instr/"+d.lq, {lache:T0}); return add("init", {nom:p.nom, pos:p.pos||"", heures:0, lacheLe:T0}, `${p.nom} lâché, ajouté en ab initio`); } }
  if (d.delvol) { const p = st.instr[d.delvol]; return upd("instr/"+d.delvol, {vols:(p.vols||[]).filter(v=>v.id!==d.vid)}, "Vol retiré"); }
  if (d.dellacher) return del("instr/"+d.dellacher, "Pilote retiré");
  if (d.delinit) return del("init/"+d.delinit, "Retiré des ab initio");
  // validités, max, mémos, événements
  if (d.cell) { ui.form.cell = d.cell; return render(); }
  if (d.delvalid) return del("valid/"+d.delvalid, "Pilote retiré");
  if (d.delmax) return del("max/"+d.delmax, "Pilote retiré");
  if (d.delmemo) return del("memos/"+d.delmemo, "Mémo supprimé");
  if (d.delev) return del("events/"+d.delev, "Événement supprimé");
  if (d.delobj) { const e2 = st.events[d.delobj]; return upd("events/"+d.delobj, {objectifs:(e2.objectifs||[]).filter(o=>o.id!==d.oid)}); }
  if (d.lic) { const Rw = lics().map(r=>({...r})); Rw[+d.lic].fait=!Rw[+d.lic].fait; return upd("ref/licences", {rows:Rw}, Rw[+d.lic].fait?"Licence renouvelée":"Annulé"); }
  if (d.moiplus || d.moimoins) { const k = d.moiplus||d.moimoins, p = Object.assign({fait:{},mois:T0.slice(0,7)}, st.perso.moi||{}); const fait = p.mois===T0.slice(0,7)?{...p.fait}:{};
    fait[k] = Math.max(0,(fait[k]||0) + (d.moiplus?1:-1)); return put("perso/moi", {...p, fait, mois:T0.slice(0,7)}); }
  if (d.vtypes) { const types = val("vtypes").split(",").map(s=>s.trim()).filter(Boolean); return put("ref/regles", {...(st.ref.regles||{}), validTypes:types}, "Types enregistrés"); }
});

  if (t.id && t.id.startsWith("date-")) ui.form[t.id.slice(5)].date = t.value;
  if (t.id==="impFile" && t.files && t.files[0]) { const fr = new FileReader(); fr.onload = () => { try { const obj = JSON.parse(fr.result); if (!obj || typeof obj!=="object") throw 0; st.db.importAll(obj); toast("Données importées"); } catch(e) { toast("Fichier illisible : choisis le fichier ftm-desk-sauvegarde."); } }; fr.readAsText(t.files[0]); return; }
  if (d.ff) { const p = pilotById(ui.pid); if (p) saveField(p, d.ff, t.value); return; }
  if (d.col && d.m) { const o = st.opl[d.m]; return upd("opl/"+d.m, {college:{...(o.college||{date:COLLEGE_DATE}), [d.col]:t.value}}, "Enregistré"); }
  if (d.stat) upd("opl/"+d.stat, {[d.f]:t.value, [d.f+"Date"]: t.value==="Validé"?T0:""}, "Statut mis à jour");
  if (d.plf) upd("opl/"+d.plf, {[d.k]:+t.value||0});
  if (d.dos!=null && d.dos!=="") upd("opl/"+d.dos, {dossier:t.value}, "Dossier mis à jour");
  if (d.memo) upd("memos/"+d.memo, {fait:t.checked});
  if (d.obj) { const e2 = st.events[d.obj]; upd("events/"+d.obj, {objectifs:(e2.objectifs||[]).map(o=>o.id===d.oid?{...o,fait:t.checked}:o)}); }
  if (d.cand!=null && d.cand!=="") { const C=(st.ref.equipes.candidatsTRI||[]).map(c=>({...c})); C[+d.cand].statut=t.value; upd("ref/equipes",{candidatsTRI:C},"Statut mis à jour"); }
  if (d.inith) upd("init/"+d.inith, {heures:+t.value||0});
  if (d.maxf) upd("max/"+d.maxf, {[d.k]:t.checked});
  if (d.maxet) upd("max/"+d.maxet, {etape:t.value});
  if (d.dim) put("ref/dim", {...(st.ref.dim||{cpt:0,fo:0,depCpt:0,depFo:0,upg:0,arrFo:0,arrCpt:0,cibleCpt:180,cibleFo:180}), [d.dim]:+t.value||0});
  if (d.regle) put("ref/regles", {...(st.ref.regles||{}), [d.regle]:+t.value||0}, "Règle enregistrée");
  if (d.moiobj) { const p = Object.assign({objectifs:{}}, st.perso.moi||{}); put("perso/moi", {...p, objectifs:{...p.objectifs, [d.moiobj]:+t.value||0}}); }
  if (d.moitxt) { const p = Object.assign({}, st.perso.moi||{}); put("perso/moi", {...p, [d.moitxt]:t.value}, "Enregistré"); }
});
V.addEventListener("input", e=>{ const id = e.target.id; if (["vQ","eqQ","volQ","hQ","pQ"].includes(id)) { ui.f[id]=e.target.value; render(); } });
V.addEventListener("submit", async e=>{
  e.preventDefault(); const f = e.target, k = f.dataset.form;
  if (k==="newpilot") { const nom = val("npNom").trim(), mat = val("npMat").trim(); if (!nom) return;
    const rows = ((st.ref.pilotes&&st.ref.pilotes.rows)||[]).slice();
    if (rows.some(p=>(mat && p.mat===mat) || nameKey(p.nom)===nameKey(nom))) return toast("Ce pilote existe déjà.");
    rows.push({id: mat || "p-"+norm(nom).toLowerCase().replace(/[^a-z0-9]+/g,"-"), nom, mat, fonction:val("npFn"), sources:["Ajout manuel"]});
    return put("ref/pilotes", {...(st.ref.pilotes||{}), rows}, "Pilote ajouté"); }
  if (k==="memo") { const txt = val("mTxt").trim(); if (!txt) return; return add("memos", {texte:txt, echeance:val("mDate")||"", source:val("mSrc"), horizon:val("mHor"), cat:val("mCat"), fait:false, cree:T0}, "Mémo ajouté"); }
  if (k==="event") return add("events", {nom:val("eNom").trim(), date:val("eDate"), objectifs:[]}, "Événement créé");
  if (k==="obj") { const id = f.dataset.eid, e2 = st.events[id]; return upd("events/"+id, {objectifs:[...(e2.objectifs||[]), {id:uid("o"), texte:val("o-"+id).trim(), date:val("od-"+id)||"", fait:false}]}, "Objectif ajouté"); }
  if (k==="prog") { const m = f.dataset.m, o = st.opl[m], tri = val("tri-"+m), date = val("date-"+m); if (!tri) return; delete ui.form[m];
    return upd("opl/"+m, {programmes:[...(o.programmes||[]), {id:uid("p"), tri, date, statut:"programmé"}]}, `Vol avec ${tri} programmé`); }
  if (k==="evnew") { const g = f.dataset.g, mat = val("enMat").trim(), fa = +val("enF")||0, tot = R().evalsStd;
    if (st.opl[mat]) return toast("Ce matricule existe déjà : modifie la fiche existante.");
    return put("opl/"+mat, {nom:val("enNom").trim(), matricule:mat, groupe:g, total:tot, evalsRestantes:Math.max(0,tot-fa), exclus:[], programmes:[], echeance:val("enD")||"", ordre:100+Object.keys(st.opl).length,
      motif: g==="CIBLE"?val("enMotif"):"", simuRequis: g==="CIBLE"?(+val("enS")||0):0, simuFaits:0, checkLocal:"Validé", checkNav:"Validé"}, "Pilote ajouté"); }
  if (k==="lacher") return add("instr", {nom:val("lNom").trim(), pos:val("lPos"), legsInit:+val("lLegs")||0, vols:[], preControle:"", cl:{requis:2,faits:0}, lache:""}, "Pilote ajouté");
  if (k==="vol") { const id = f.dataset.pid, p = st.instr[id]; delete ui.form["v"+id];
    return upd("instr/"+id, {vols:[...(p.vols||[]), {id:uid("v"), date:val("vd-"+id), instr:val("vi-"+id), vols:val("vv-"+id), legs:+val("vl-"+id)||2, safety:val("vs-"+id)||""}]}, "Vol enregistré"); }
  if (k==="init") return add("init", {nom:val("iNom").trim(), pos:val("iPos"), heures:+val("iH")||0, lacheLe:""}, "Ajouté en ab initio");
  if (k==="pair") { const a = val("pA"), b = norm(val("pB")); const hit = Object.values(st.init).find(p=>surname(p.nom)===surname(b) && norm(p.nom)!==norm(a));
    return toast(hit ? `Interdit : ${a} et ${hit.nom} sont tous les deux ab initio.` : "OK : l'autre membre n'est pas ab initio."); }
  if (k==="slot") { const [m,ji,si] = f.dataset.key.split("|"); const s = st.simu[m].jours[ji].slots[si], ni = val("sl-i").trim(), nc = val("sl-c").trim(); delete ui.form.slot;
    const ch = []; if (ni!==(s.instr||"")) ch.push(`TRI ${s.instr||"(vide)"} → ${ni||"(vide)"}`); if (nc!==(s.crew||"")) ch.push(`équipage ${s.crew||"(vide)"} → ${nc||"(vide)"}`);
    if (!ch.length) return render(); return setSlot(m,+ji,+si,{instr:ni, crew:nc}, `${dayLabel(st.simu[m].jours[ji].date)} S${s.s} : ${ch.join(" ; ")}`); }
  if (k==="addslot") { const m = f.dataset.m, ji = +f.dataset.ji, sn = +val("as-s"); const J = JSON.parse(JSON.stringify(st.simu[m].jours));
    J[ji].slots.push({s:sn, h:SLOTS[sn-1], instr:val("as-i").trim(), crew:val("as-c").trim()}); J[ji].slots.sort((a,b)=>a.s-b.s); delete ui.form["add"+m+ji];
    await upd("simu/"+m, {jours:J}); return add("simulog", {date:T0, texte:`${dayLabel(J[ji].date)} S${sn} : nouvelle séance (${val("as-i")||"sans TRI"} · ${val("as-c")})`, notifie:false, cree:Date.now()}, "Séance ajoutée"); }
  if (k==="valid") return add("valid", {nom:val("vaNom").trim(), fonction:val("vaFn"), items:{}}, "Pilote ajouté");
  if (k==="cell") { const [id,type] = f.dataset.key.split("|"); const p = st.valid[id]; delete ui.form.cell; return upd("valid/"+id, {items:{...(p.items||{}), [type]:val("ce")}}, "Date enregistrée"); }
  if (k==="max") return add("max", {nom:val("xNom").trim(), pos:val("xPos"), etape:val("xEt"), licenceOk:false, suiviInforme:false, progInforme:false}, "Pilote ajouté");
});

/* base locale (hors claude.ai, ex. GitHub Pages) : même interface, stockée dans ce navigateur */
function makeLocalDb(){
  const KEY = "ftmdesk.db.v1"; let data = {};
  try { data = JSON.parse(localStorage.getItem(KEY)||"{}") || {}; } catch(e) { data = {}; }
  const subs = {};
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e) { toast("Stockage plein ou bloqué sur cet appareil."); } };
  const clone = o => JSON.parse(JSON.stringify(o));
  const snap = c => ({docs: Object.entries(data[c]||{}).map(([id,d])=>({id, exists:true, data:()=>clone(d), metadata:{fromCache:false,hasPendingWrites:false}}))});
  const emit = c => (subs[c]||[]).forEach(fn=>{ try{ fn(snap(c)); }catch(e){} });
  const merge = (a,b) => { const o = {...a}; Object.entries(b).forEach(([k,v])=>{ o[k] = (v && typeof v==="object" && !Array.isArray(v) && a[k] && typeof a[k]==="object" && !Array.isArray(a[k])) ? merge(a[k], v) : v; }); return o; };
  const docRef = (c, id) => ({ id,
    async get(){ const d = (data[c]||{})[id]; return {id, exists:!!d, data:()=>d?clone(d):undefined}; },
    async set(v){ (data[c] = data[c]||{})[id] = clone(v); save(); emit(c); },
    async update(v){ const cur = (data[c]||{})[id]; if (!cur) throw {code:"invalid_argument", message:"absent"}; data[c][id] = merge(cur, clone(v)); save(); emit(c); },
    async delete(){ if (data[c]) delete data[c][id]; save(); emit(c); } });
  const api = {
    collection: c => ({ onSnapshot(fn){ (subs[c] = subs[c]||[]).push(fn); setTimeout(()=>fn(snap(c)),0); return ()=>{ subs[c] = subs[c].filter(x=>x!==fn); }; },
      doc: id => docRef(c, id || uid("d")),
      async add(v){ const id = uid("d"); await docRef(c, id).set(v); return docRef(c, id); } }),
    doc: path => { const i = path.lastIndexOf("/"); return docRef(path.slice(0,i), path.slice(i+1)); },
    exportAll: () => clone(data),
    importAll: obj => { data = clone(obj||{}); save(); Object.keys(subs).forEach(emit); }
  };
  return api;
}

(async function boot(){
  let db = null;
  if (window.claude && window.claude.use) { try { db = await window.claude.use("db"); } catch(e) { db = null; } }
  if (!db) { db = makeLocalDb(); st.local = true; }
  st.db = db;
  COLS.forEach(name => db.collection(name).onSnapshot(s=>{ st[name]={}; s.docs.forEach(x=>st[name][x.id]=x.data()); st.loaded[name]=true; render(); }, ()=>{ st.loaded[name]=true; render(); }));
})();
})();
