<title>FTM Desk 737</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: home = overhead annunciator panel (one lit tile per module) above the alarm list; each module opens as its own view */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#13203A; --muted:#5D6A80; --line:#DCE2EB;
  --accent:#1E58B4; --accent-soft:#E3ECFA;
  --crit:#C42B2B; --crit-soft:#FBE7E6; --warn:#B26A00; --warn-soft:#FDF1DC; --ok:#1E7A46; --ok-soft:#E2F3E8;
  --panel:#1A2233; --panel-ink:#C9D3E3; --lit-warn:#F2B33D; --lit-crit:#F05A4F; --lit-ok:#55C27D;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1420; --surface:#162032; --ink:#E6ECF5; --muted:#93A1B8; --line:#26324A;
  --accent:#7FA9F0; --accent-soft:#1C2B47;
  --crit:#F07A72; --crit-soft:#3A1D20; --warn:#F0B65A; --warn-soft:#352A16; --ok:#6BCB8E; --ok-soft:#173022;
  --panel:#0A0F18; --panel-ink:#AEB9CC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1420; --surface:#162032; --ink:#E6ECF5; --muted:#93A1B8; --line:#26324A;
  --accent:#7FA9F0; --accent-soft:#1C2B47;
  --crit:#F07A72; --crit-soft:#3A1D20; --warn:#F0B65A; --warn-soft:#352A16; --ok:#6BCB8E; --ok-soft:#173022;
  --panel:#0A0F18; --panel-ink:#AEB9CC; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px}
.top .l{display:flex;align-items:center;gap:10px;min-width:0}
h1{font-family:var(--display);font-weight:700;font-size:1.35rem;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1 small{font-weight:500;color:var(--muted);font-size:.9rem;margin-left:6px}
.back{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 10px;font:600 .9rem var(--body);cursor:pointer}
.date{font-family:var(--mono);font-size:.78rem;color:var(--muted);white-space:nowrap}
main{padding-block:16px 56px;display:grid;gap:18px}
main>*{min-width:0}
h2{font-family:var(--display);font-weight:600;font-size:1.02rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:4px 0 0}
h3{font-family:var(--display);font-weight:600;font-size:1.1rem;margin:0}
/* annunciator panel */
.panel{background:var(--panel);border-radius:12px;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.ann{position:relative;border:1px solid #2C3850;background:#121A28;color:var(--panel-ink);border-radius:6px;padding:10px 10px 9px;text-align:left;cursor:pointer;display:grid;gap:3px;min-height:76px;font:inherit}
.ann .c{font:700 .98rem var(--display);letter-spacing:.08em;text-transform:uppercase}
.ann .s{font-size:.76rem;opacity:.85;line-height:1.25}
.ann .k{position:absolute;top:8px;right:9px;font:500 .8rem var(--mono)}
.ann.crit{background:#3A1414;border-color:var(--lit-crit);color:#FFD9D5;box-shadow:0 0 0 1px var(--lit-crit) inset,0 0 14px rgba(240,90,79,.25)}
.ann.crit .c{color:var(--lit-crit)}
.ann.warn{background:#342611;border-color:var(--lit-warn);color:#FCE7BE;box-shadow:0 0 0 1px var(--lit-warn) inset}
.ann.warn .c{color:var(--lit-warn)}
.ann.ok .c{color:var(--lit-ok)}
.ann:focus-visible{outline:2px solid var(--lit-warn);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.ann.crit .c{animation:blink 1.6s steps(2,start) infinite}@keyframes blink{50%{opacity:.55}}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;text-align:left;color:inherit;font:inherit}
.kpi b{display:block;font-family:var(--display);font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:.84rem;color:var(--muted)}
.kpi.crit b{color:var(--crit)} .kpi.warn b{color:var(--warn)} .kpi.ok b{color:var(--ok)}
.list{display:grid;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:9px 12px;display:flex;gap:10px;align-items:flex-start}
.item.crit{border-left-color:var(--crit)} .item.warn{border-left-color:var(--warn)} .item.info{border-left-color:var(--accent)} .item.ok{border-left-color:var(--ok)}
.item .txt{flex:1;min-width:0}
button.item{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.sub{color:var(--muted);font-size:.85rem}
.pill{display:inline-block;font:600 .72rem var(--body);letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:999px;white-space:nowrap}
.pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.info{background:var(--accent-soft);color:var(--accent)} .pill.mute{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;min-width:0}
.card.crit{border-left:4px solid var(--crit)} .card.warn{border-left:4px solid var(--warn)} .card.done{opacity:.72}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.grow{flex:1 1 160px;min-width:0}
.name{font-weight:700;font-size:1.02rem}
.mono{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:.82rem;padding:3px 9px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button.chip{cursor:pointer}
.chip.free{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.chip.free.sug{box-shadow:inset 0 0 0 1px var(--ok);font-weight:700}
.chip.no{text-decoration:line-through;color:var(--muted)}
.chip.pend{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.big{font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.prog{display:grid;gap:6px}
.prog .p{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem;padding:6px 8px;border-radius:6px;background:var(--bg)}
button.b{font:600 .85rem var(--body);border-radius:7px;padding:6px 11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.b.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
button.b.okb{border-color:var(--ok);color:var(--ok)}
button.b.crb{border-color:var(--crit);color:var(--crit)}
button.b.sm{padding:3px 8px;font-size:.78rem}
button.b:disabled{opacity:.45;cursor:not-allowed}
button.link{border:0;background:none;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=text],input[type=date],input[type=number],input[type=search],textarea{font:inherit;font-size:.92rem;padding:6px 8px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0;max-width:100%}
input[type=number]{width:90px}
input[type=search]{width:100%}
textarea{width:100%;min-height:64px;resize:vertical}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px;border-radius:8px;background:var(--accent-soft)}
.form label{font-size:.8rem;color:var(--muted);display:grid;gap:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);color:var(--muted);font:600 .84rem var(--body);padding:6px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.day{display:grid;gap:6px}
.dayh{font-family:var(--display);font-weight:600;font-size:1rem;display:flex;gap:8px;align-items:baseline}
.dayh.today{color:var(--accent)}
.slot{display:grid;grid-template-columns:58px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:8px 10px}
.slot.empty{border-left-color:var(--crit)} .slot.mine{border-left-color:var(--accent);background:var(--accent-soft)}
.slot .t{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.slot .t b{display:block;color:var(--ink);font-weight:500}
.slot .w{min-width:0;display:grid;gap:4px}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:600 .72rem var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.cell{white-space:nowrap;font-family:var(--mono);font-size:.78rem}
td.cell.crit{background:var(--crit-soft);color:var(--crit)} td.cell.warn{background:var(--warn-soft);color:var(--warn)} td.cell.ok{color:var(--ok)}
.note{font-size:.82rem;color:var(--muted)}
.empty-state{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:20px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.grid2>*{min-width:0}
/* leg gauge: 0..40 with marks at safety, alarm, release */
.gauge{position:relative;height:14px;border-radius:7px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.gauge i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.gauge.warn i{background:var(--warn)} .gauge.crit i{background:var(--crit)} .gauge.ok i{background:var(--ok)}
.gauge u{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.35}
.gscale{display:flex;justify-content:space-between;font:500 .7rem var(--mono);color:var(--muted)}
.msg{white-space:pre-wrap;font-family:var(--mono);font-size:.8rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto}
details>summary{cursor:pointer;font-weight:600}
.tip{display:grid;gap:4px;padding:10px 12px;border-radius:8px;background:var(--bg)}
.tip b{font-family:var(--display);font-size:1rem}
</style>

<header>
  <div class="wrap top">
    <div class="l"><button class="back" id="back" hidden>Panneau</button><h1 id="ttl">FTM Desk<small>B737 NG/MAX</small></h1></div>
    <span class="date" id="today"></span>
  </div>
</header>
<main class="wrap" id="view">
  <div class="empty-state">Chargement du FTM Desk : évaluations, lâchers, simulateur, validités, rappels…</div>
</main>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const ME = "BOUCHENAFA";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const T0 = iso(TODAY);
const addDays = (s,n) => { const d = new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return iso(d); };
const addMonths = (s,n) => { const d = new Date(s+"T00:00:00"); d.setMonth(d.getMonth()+n); return iso(d); };
const daysTo = s => Math.round((new Date(s+"T00:00:00") - TODAY)/864e5);
const frDate = s => { if(!s) return ""; const [y,m,d] = s.split("-"); return d+"/"+m+"/"+y; };
const frToIso = s => { const m = /^(\d\d)\/(\d\d)\/(\d{4})$/.exec(s||""); return m ? m[3]+"-"+m[2]+"-"+m[1] : ""; };
const JOURS = ["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
const MOIS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const dayLabel = s => { const d = new Date(s+"T00:00:00"); return JOURS[d.getDay()]+" "+d.getDate()+" "+MOIS[d.getMonth()]; };
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9 ]/g," ").replace(/\s+/g," ").trim();
const surname = s => { const w = norm(s).split(" "); return ["EL","AIT","BEN","OULD","SABER","HADJ","AHMED","NAIT"].includes(w[0]) && w[1] ? w[0]+" "+w[1] : (w[0]||""); };
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
const jx = n => n===0?"aujourd'hui":(n>0?"J-"+n:"dépassé de "+(-n)+" j");
$("#today").textContent = dayLabel(T0) + " " + TODAY.getFullYear();

const COLS = ["opl","ref","simu","vols","memos","events","instr","init","valid","max","simulog","perso"];
const st = { db:null, dbFailed:false, loaded:{} }; COLS.forEach(c=>{ st[c]={}; st.loaded[c]=false; });
const ui = { view:"home", form:{}, f:{} };
const VIEWS = ["home","memos","events","lacher","init","pl","evals","simu","valid","max","equipes","vols","dim","moi","regles"];
try { const t = localStorage.getItem("ftm.view"); if (VIEWS.includes(t)) ui.view = t; } catch(e) {}
const h = (location.hash||"").slice(1); if (VIEWS.includes(h)) ui.view = h;
const F = (k,d) => (k in ui.f ? ui.f[k] : d);

function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(()=>t.hidden = true, 2600); }
const fail = e => toast(e && e.code === "invalid_argument" ? "Modification refusée (droits ou format)." : e && e.code==="quota_exceeded" ? "Base pleine : supprime d'anciens éléments." : "Échec de l'enregistrement, réessaie.");
async function upd(path, data, ok){ if(!st.db) return toast("Base indisponible."); try{ await st.db.doc(path).update(data); if(ok) toast(ok);}catch(e){ fail(e);} }
async function put(path, data, ok){ if(!st.db) return toast("Base indisponible."); try{ await st.db.doc(path).set(data); if(ok) toast(ok);}catch(e){ fail(e);} }
async function del(path, ok){ if(!st.db) return; try{ await st.db.doc(path).delete(); if(ok) toast(ok);}catch(e){ fail(e);} }
async function add(col, data, ok){ if(!st.db) return toast("Base indisponible."); try{ await st.db.collection(col).add(data); if(ok) toast(ok);}catch(e){ fail(e);} }

/* ---------- règles (modifiables, à confirmer avec le Manex D) ---------- */
const DEF_REGLES = { legsLacher:40, legsAlerte:36, legsSafety:4, plHeures:100, plEtapes:25, initHeures:150, evalsStd:5, clMois:12,
  validTypes:["CL","IC","IL","Check TRI","CRM","DGR","SMS","Sûreté","SSP1","SSP2"], manexConfirme:false };
const R = () => Object.assign({}, DEF_REGLES, st.ref.regles||{});
const CAUSES = [["CGML","Maladie (CGML)"],["ABS","Absence pilote"],["IRGAV","Irrégularité avion"],["AMP","Amplitude"],["ABSTRI","Absence TRI"],["SOLL","Sollicitation"]];
const causeLabel = c => (CAUSES.find(x=>x[0]===c)||[c,c])[1];
const SOURCES = ["DO","SDF","SDPNT","Chef secteur ligne","Adjoint","Formation","Programmes","Moi"];

/* ---------- évaluations (OPL, passage CDB, entraînement ciblé) ---------- */
const TRI = () => (st.ref.tri && st.ref.tri.evaluateurs) || [];
const GROUPES = {OPL:"OPL / PL", CDB:"Passage CDB", CIBLE:"Entraînement ciblé"};
const ev = () => Object.values(st.opl).sort((a,b)=>(a.ordre||0)-(b.ordre||0));
const inEval = o => typeof o.evalsRestantes === "number";
const pending = o => (o.programmes||[]).filter(p=>p.statut==="programmé");
const faits = o => (o.total||R().evalsStd) - (o.evalsRestantes||0);
const aPlanifier = o => Math.max(0,(o.evalsRestantes||0) - pending(o).length);
function triLoad(){ const L = {}; TRI().forEach(t=>L[t]=0); ev().forEach(o=>pending(o).forEach(p=>{ L[p.tri]=(L[p.tri]||0)+1; })); return L; }
function triDispo(o){
  const no = new Set([...(o.exclus||[]), ...pending(o).map(p=>p.tri)].map(norm));
  const L = triLoad();
  return TRI().filter(t=>!no.has(norm(t))).sort((a,b)=>(L[a]-L[b]) || a.localeCompare(b));
}
function evLevel(o){
  if (!inEval(o)) return "";
  if ((o.evalsRestantes||0) === 0 && !(o.simuRequis>(o.simuFaits||0))) return "done";
  const g = o.groupe||"OPL";
  if (g==="CDB" && faits(o) >= (o.total||5)-1 && o.evalsRestantes>0) return "crit";
  if (o.echeance && o.echeance < T0 && aPlanifier(o)>0) return "crit";
  if (o.echeance && daysTo(o.echeance) <= 7 && o.evalsRestantes>0) return "crit";
  if (o.echeance && daysTo(o.echeance) <= 21 && aPlanifier(o)>0) return "warn";
  return "";
}

/* ---------- simulateur ---------- */
const SLOTS = ["06:00","10:15","14:30","18:45","23:00"];
function allSlots(){
  const out = [];
  Object.values(st.simu).forEach(m => (m.jours||[]).forEach((j,ji) => (j.slots||[]).forEach((s,si) => out.push({mois:m.mois, ji, si, date:j.date, ...s}))));
  return out.sort((a,b)=> a.date.localeCompare(b.date) || a.s-b.s);
}
const isMine = s => norm(s.instr).includes(ME);
const isEmptySlot = s => !String(s.instr||"").replace(/^(TRI|TRE)\s*[:;]?\s*$/i,"").trim() && (s.crew||"").trim();
function instrNames(txt){
  return String(txt||"").split(/\+/).map(x=>x.replace(/\b(IC|IE|CBTA|TRI|TRE)\b\s*[:;]?/gi,"").trim()).filter(Boolean).map(surname).filter(Boolean);
}
function triPool(){
  const P = new Map();
  ((st.ref.tri&&st.ref.tri.secteur)||[]).forEach(n=>P.set(surname(n), n));
  TRI().forEach(n=>{ if(!P.has(surname(n))) P.set(surname(n), n); });
  allSlots().forEach(s=>instrNames(s.instr).forEach(n=>{ if(!P.has(n)) P.set(n, n.charAt(0)+n.slice(1).toLowerCase()); }));
  return P;
}
const busyOn = d => new Set(allSlots().filter(s=>s.date===d).flatMap(s=>instrNames(s.instr)));
function monthLoad(mois){ const L={}; allSlots().filter(s=>s.mois===mois).forEach(s=>instrNames(s.instr).forEach(n=>L[n]=(L[n]||0)+1)); return L; }
function permutations(slot){
  const pool = triPool(), busy = busyOn(slot.date), L = monthLoad(slot.mois);
  const libres = [...pool.entries()].filter(([k])=>!busy.has(k)).sort((a,b)=>(L[a[0]]||0)-(L[b[0]]||0)).slice(0,8).map(([k,n])=>({k,n,load:L[k]||0}));
  const mine = instrNames(slot.instr);
  const echanges = [];
  if (mine.length===1) allSlots().forEach(o=>{
    if (o===slot || o.mois!==slot.mois || Math.abs(daysTo(o.date)-daysTo(slot.date))>3 || (o.date===slot.date && o.s===slot.s)) return;
    const on = instrNames(o.instr); if (on.length!==1 || on[0]===mine[0]) return;
    const freeA = !busyOn(o.date).has(mine[0]) || o.date===slot.date, freeB = !busy.has(on[0]) || o.date===slot.date;
    if (o.date!==slot.date && freeA && freeB) echanges.push(o);
  });
  return {libres, echanges:echanges.slice(0,6)};
}
async function setSlot(mois, ji, si, patch, logTxt){
  const J = JSON.parse(JSON.stringify(st.simu[mois].jours));
  if (patch===null) J[ji].slots.splice(si,1); else Object.assign(J[ji].slots[si], patch);
  await upd("simu/"+mois, {jours:J});
  if (logTxt) await add("simulog", {date:T0, texte:logTxt, notifie:false, cree:Date.now()});
}

/* ---------- lâcher en ligne ---------- */
const lacherList = () => Object.entries(st.instr).map(([id,d])=>({id,...d}));
const legsOf = p => (p.vols||[]).reduce((n,v)=>n+(+v.legs||0),0) + (+p.legsInit||0);
const safetyNames = () => new Set(((st.ref.equipes&&st.ref.equipes.safety)||[]).map(p=>surname(p.nom)));
function lacherState(p){
  const r = R(), L = legsOf(p);
  if (p.lache) return {k:"ok", t:"Lâché le "+frDate(p.lache)};
  if (p.cl && (p.cl.faits||0) > 0) return {k:"info", t:`Check Line ${p.cl.faits}/${p.cl.requis||2}`};
  if (L >= r.legsLacher) return {k:"crit", t:"40 legs : Check Line à programmer"};
  if (L >= r.legsAlerte) return {k:"crit", t:`${L} legs : à suivre de près`};
  return {k: p.preControle?"info":"", t: p.preControle?"Pré-contrôle fait":"En instruction"};
}
function legsSansSafety(p){
  const r = R(), S = safetyNames(); let cum = +p.legsInit||0; const bad = [];
  (p.vols||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(v=>{
    if (cum < r.legsSafety && !(v.safety && (S.size===0 || S.has(surname(v.safety))))) bad.push(v);
    cum += (+v.legs||0);
  });
  return bad;
}

/* ---------- validités ---------- */
const validList = () => Object.entries(st.valid).map(([id,d])=>({id,...d}));
function cellLevel(d){ if(!d) return ""; const n = daysTo(d); return n<0?"crit":(n<=30?"warn":"ok"); }

/* ---------- memos / événements ---------- */
const memos = () => Object.entries(st.memos).map(([id,d])=>({id,...d}));
const events = () => Object.entries(st.events).map(([id,d])=>({id,...d})).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
function memoLevel(m){ if (m.fait) return "ok"; if (!m.echeance) return "info"; const n = daysTo(m.echeance); return n<0?"crit":(n<=2?"crit":(n<=7?"warn":"info")); }

/* ---------- licences ---------- */
const lics = () => (st.ref.licences && st.ref.licences.rows) || [];
function licStatus(r){
  if (r.fait) return {k:"ok", t:"Renouvelée"};
  if (!r.validite) return {k:"warn", t:"Date manquante"};
  const d = frToIso(r.validite); if (d < T0) return {k:"crit", t:"Échue"};
  if (daysTo(d) <= 30) return {k:"warn", t:"< 30 j"}; return {k:"ok", t:"Valide"};
}

/* ---------- vols TrainerU ---------- */
const VCODE = {i:"Instr. ligne", n:"Instr. PL", p:"Pré-contrôle", c:"Lâché", e:"Contrôle ligne", v:"Éval"};
const VGROUP = {i:"instr", n:"instr", p:"ctrl", c:"ctrl", e:"ctrl", v:"eval"};
function volsRows(){
  const seen = new Set(), out = [];
  Object.values(st.vols).forEach(rep=>(rep.rows||[]).forEach(r=>{ const k = r.date+"|"+r.heure+"|"+(r.stagiaire.id||r.stagiaire.nom); if (!seen.has(k)) { seen.add(k); out.push(r); } }));
  return out.sort((a,b)=>b.date.localeCompare(a.date) || String(b.heure).localeCompare(String(a.heure)));
}
function trainees(){
  const T = {};
  volsRows().forEach(r=>{ const k = norm(r.stagiaire.nom);
    const t = T[k] = T[k] || {key:k, nom:r.stagiaire.nom, pos:r.stagiaire.pos, id:r.stagiaire.id, vols:[], n:{}, last:"", lache:""};
    t.vols.push(r); t.n[r.code]=(t.n[r.code]||0)+1; if (r.date>t.last) t.last=r.date; if (r.code==="c" && r.date>t.lache) t.lache=r.date; });
  return Object.values(T);
}

/* ---------- alarmes (tous modules) ---------- */
function alerts(){
  const A = [], r = R();
  // évaluations
  ev().forEach(o=>{
    if (!inEval(o)) return;
    const lv = evLevel(o), n = aPlanifier(o), g = o.groupe||"OPL";
    if (g==="CDB" && faits(o) >= (o.total||5)-1 && o.evalsRestantes>0)
      A.push({k:"crit", v:"evals", t:`${o.nom} : ${faits(o)} évals faites, il en reste ${o.evalsRestantes}`, s:`À finir avant le ${frDate(o.echeance)||"collège"} (${jx(daysTo(o.echeance))})`});
    else if (lv==="crit" && o.evalsRestantes>0) A.push({k:"crit", v:"evals", t:`${o.nom} : ${o.evalsRestantes} éval${o.evalsRestantes>1?"s":""} restante${o.evalsRestantes>1?"s":""} (${n} à programmer)`, s:`${GROUPES[g]} · échéance ${frDate(o.echeance)} ${jx(daysTo(o.echeance))}`});
    else if (lv==="warn") A.push({k:"warn", v:"evals", t:`${o.nom} : ${n} vol${n>1?"s":""} d'éval à programmer`, s:`${GROUPES[g]} · échéance ${frDate(o.echeance)}`});
    pending(o).forEach(p=>{ if (p.date && p.date < T0) A.push({k:"warn", v:"evals", t:`${o.nom} : éval avec ${p.tri} du ${frDate(p.date)}`, s:"Date passée : marque-la faite, ou ratée avec la cause"}); });
    if (o.simuRequis && (o.simuFaits||0) < o.simuRequis) A.push({k:"warn", v:"evals", t:`${o.nom} : ${o.simuRequis-(o.simuFaits||0)} simu(s) d'entraînement ciblé à faire`, s:o.motif||""});
  });
  // même TRI deux fois
  const triOf = n => TRI().find(t=>norm(n).startsWith(norm(t))) || surname(n);
  ev().forEach(o=>{
    const V = volsRows().filter(x=>x.code==="v" && (x.stagiaire.id===o.matricule || surname(x.stagiaire.nom)===surname(o.nom)));
    const by = {}; V.forEach(x=>(by[triOf(x.instr.nom)] = by[triOf(x.instr.nom)] || []).push(x.date));
    Object.entries(by).forEach(([t,ds])=>{ const u=[...new Set(ds)].sort(); if (u.some((d,i)=>i>0 && d>addDays(u[i-1],1)))
      A.push({k:"crit", v:"evals", t:`${o.nom} : 2 vols d'éval avec ${t}`, s:`Interdit (${u.map(frDate).join(", ")}). Refaire un des vols avec un autre TRI.`}); });
  });
  // checks PL / dossiers
  ev().filter(o=>!inEval(o)).forEach(o=>{
    ["checkLocal","checkNav"].forEach(f=>{ const m = /Prévu le (\d\d)\/(\d\d)/.exec(o[f]||""); if (m && "2026-"+m[2]+"-"+m[1] < T0) A.push({k:"warn", v:"pl", t:`${o.nom} : ${f==="checkLocal"?"check local":"check nav"} ${o[f].toLowerCase()}`, s:"Résultat à mettre à jour"}); });
    if (o.checkLocal==="Instruction PL" && ((o.plHeures||0) >= r.plHeures || (o.plEtapes||0) >= r.plEtapes) && !o.dossier) A.push({k:"warn", v:"pl", t:`${o.nom} : instruction PL terminée`, s:"Dossier à ramener à la formation pour désignation"});
  });
  // lâcher
  lacherList().forEach(p=>{
    if (p.lache) return; const L = legsOf(p);
    if (L >= r.legsAlerte) A.push({k:"crit", v:"lacher", t:`${p.nom} : ${L} legs sur ${r.legsLacher}`, s: L>=r.legsLacher?"Check Line à programmer":"Alarme 36 legs : suivre de près et programmer le contrôle"});
    legsSansSafety(p).forEach(v=>A.push({k:"crit", v:"lacher", t:`${p.nom} : vol du ${frDate(v.date)} sans safety pilot`, s:`Les ${r.legsSafety} premiers legs exigent un safety pilot de la liste`}));
  });
  // initiation
  Object.entries(st.init).forEach(([id,p])=>{ if ((p.heures||0) >= r.initHeures) A.push({k:"info", v:"init", t:`${p.nom} : ${p.heures} h, fin d'initiation`, s:"Peut sortir de la liste initiation"}); });
  // simu
  allSlots().filter(s=>s.date>=T0 && s.date<=addDays(T0,14) && isEmptySlot(s)).forEach(s=>A.push({k: daysTo(s.date)<=3?"crit":"warn", v:"simu", t:`Simu ${dayLabel(s.date)} S${s.s} : TRI à trouver`, s:s.crew}));
  const nlog = Object.values(st.simulog).filter(l=>!l.notifie).length;
  if (nlog) A.push({k:"warn", v:"simu", t:`${nlog} changement${nlog>1?"s":""} simu à notifier au CSV Kouba`, s:"Message prêt à copier dans l'onglet Simu"});
  // validités
  validList().forEach(p=>Object.entries(p.items||{}).forEach(([t,d])=>{ const lv = cellLevel(d); if (lv==="crit"||lv==="warn") A.push({k:lv, v:"valid", t:`${p.nom} : ${t} ${lv==="crit"?"expiré":"expire"} le ${frDate(d)}`, s: lv==="crit"?"À reprogrammer":"Moins de 30 jours"}); }));
  const nl = lics().filter(x=>licStatus(x).k==="crit").length;
  if (nl) A.push({k:"warn", v:"equipes", t:`${nl} licences échues à faire renouveler`, s:"État de suivi du 30/08/2026"});
  // MAX
  Object.values(st.max).forEach(p=>{ if (p.licenceOk && (!p.suiviInforme || !p.progInforme)) A.push({k:"warn", v:"max", t:`${p.nom} : licence MAX prête`, s:`Informer ${[!p.suiviInforme&&"le suivi des licences",!p.progInforme&&"la conception programme"].filter(Boolean).join(" et ")}`}); });
  // rappels
  memos().filter(m=>!m.fait && m.echeance && daysTo(m.echeance)<=7).forEach(m=>A.push({k:memoLevel(m), v:"memos", t:m.texte, s:`${m.source?m.source+" · ":""}${frDate(m.echeance)} (${jx(daysTo(m.echeance))})`}));
  events().forEach(e=>{ const n = daysTo(e.date), open = (e.objectifs||[]).filter(o=>!o.fait).length; if (n>=0 && n<=30 && open) A.push({k:n<=7?"crit":"warn", v:"events", t:`${e.nom} : ${jx(n)}`, s:`${open} objectif${open>1?"s":""} non atteint${open>1?"s":""}`}); });
  // lâchés récents
  trainees().filter(t=>t.lache && t.lache>=addDays(T0,-7)).forEach(t=>A.push({k:"info", v:"vols", t:`${t.nom} lâché le ${frDate(t.lache)}`, s:"Clôturer son dossier et l'ajouter en initiation"}));
  const o = {crit:0,warn:1,info:2,ok:3};
  return A.sort((a,b)=>o[a.k]-o[b.k]);
}

function vHome(){

    return `<button class="ann ${k}" data-go="${id}"><span class="c">${c}</span><span class="s">${s}</span>${n?`<span class="k">${n}</span>`:""}</button>`;}).join("")}</section>

    <h2>Alarmes et rappels (${A.length})</h2>

/* --- Rappels --- */
function vMemos(){
  const all = memos(), src = F("mSrcF","Tous"), cat = F("mCatF","tout");
  const L = all.filter(m=>src==="Tous"||m.source===src).filter(m=>cat==="tout"||(m.cat||"pro")===cat);
  const groups = [["En retard", m=>!m.fait && m.echeance && m.echeance<T0],["Cette semaine", m=>!m.fait && ((m.echeance && m.echeance>=T0 && daysTo(m.echeance)<=7) || (!m.echeance && m.horizon==="semaine"))],
    ["Ce mois", m=>!m.fait && ((m.echeance && daysTo(m.echeance)>7 && daysTo(m.echeance)<=31) || (!m.echeance && m.horizon==="mois"))],
    ["Cette année", m=>!m.fait && ((m.echeance && daysTo(m.echeance)>31) || (!m.echeance && m.horizon==="annee"))],
    ["Sans date", m=>!m.fait && !m.echeance && !m.horizon],["Fait", m=>m.fait]];

    <div class="txt"><div style="${m.fait?"text-decoration:line-through;color:var(--muted)":""}">${esc(m.texte)}</div>
    <div class="sub">${[m.source&&m.source!=="Moi"?"Demandé par "+m.source:"", m.cat==="projet"?"Projet perso":"", m.echeance?"Butoir "+frDate(m.echeance)+" ("+jx(daysTo(m.echeance))+")":""].filter(Boolean).map(esc).join(" · ")}</div></div>
    <button class="b sm" data-delmemo="${m.id}" aria-label="Supprimer">✕</button></div>`;
  return `${quickMemo()}
  <div class="row"><span class="note">Demandé par</span><div class="seg">${["Tous",...SOURCES].map(s=>`<button data-fset="mSrcF" data-val="${s}" aria-pressed="${s===src}">${s}</button>`).join("")}</div></div>

  ${groups.map(([g,fn])=>{ const X = L.filter(fn).sort((a,b)=>String(a.echeance||"9").localeCompare(String(b.echeance||"9"))); return X.length?`<section class="list"><h2>${g} (${X.length})</h2>${X.map(row).join("")}</section>`:""; }).join("") || `<div class="empty-state">Aucun mémo. Écris ici tout ce qui te passe par la tête : je te le rappelle sur le panneau dès que la date butoir approche.</div>`}`;

/* --- Lâcher en ligne --- */

  const r = R(), max = r.legsLacher, k = L>=r.legsAlerte?"crit":(L>=r.legsAlerte-6?"warn":"");
  const pos = n => (Math.min(n,max)/max*100).toFixed(1)+"%";
  return `<div class="gauge ${k}"><i style="width:${pos(L)}"></i><u style="left:${pos(r.legsSafety)}"></u><u style="left:${pos(r.legsAlerte)}"></u></div>
  <div class="gscale"><span>0</span><span>safety ${r.legsSafety}</span><span>alarme ${r.legsAlerte}</span><span>${max} legs</span></div>`;
}

function vVols(){

  const q = norm(F("volQ","")), vf = F("volF","all");
  const T = trainees().filter(t=> vf==="all" || t.vols.some(v=>VGROUP[v.code]===vf)).filter(t=> !q || norm(t.nom).includes(q) || t.vols.some(v=>norm(v.instr.nom).includes(q))).sort((a,b)=>b.last.localeCompare(a.last));
  const st2 = t => t.n.c?{k:"ok",t:"Lâché"}:t.n.e?{k:"ok",t:"Contrôle ligne"}:t.n.p?{k:"info",t:"Pré-contrôle fait"}:(t.n.v&&!t.n.i&&!t.n.n)?{k:"info",t:"En évaluation"}:{k:"warn",t:"En instruction"};

  <section class="grid2">${T.map(t=>{ const s = st2(t);
    return `<article class="card"><div class="row spread"><div><div class="name">${esc(t.nom)}</div><div class="mono">${esc(t.pos)} · ${esc(t.id)}</div></div><span class="pill ${s.k}">${s.t}</span></div>

  ${(d.cpt||d.fo)?`<div class="msg">Demande à formuler : ${bC>0?bC+" commandant(s) de bord":"aucun CDB"} et ${bF>0?bF+" copilote(s)":"aucun copilote"} pour atteindre ${d.cibleCpt} CPT / ${d.cibleFo} FO${d.upg?`, en tenant compte de ${d.upg} passage(s) CDB`:""}.</div>`:`<div class="note">Envoie-moi l'effectif du secteur et les départs, ou saisis-les ici : le besoin se calcule tout seul.</div>`}`;

const TITLES = Object.fromEntries(MODULES.map(([id,c])=>[id,c]));
function render(){
  const all = COLS.every(c=>st.loaded[c]);
  $("#back").hidden = ui.view==="home";
  $("#ttl").innerHTML = ui.view==="home" ? `FTM Desk<small>B737 NG/MAX</small>` : esc(TITLES[ui.view]||"");
  if (st.dbFailed) { $("#view").innerHTML = `<div class="empty-state">Ouvre cette page depuis claude.ai, connecté à ton compte, pour voir et modifier tes données.</div>`; return; }
  if (!all) return;
  const a = document.activeElement, fid = a && a.id, pos = fid && a.selectionStart;
  if (a && a.tagName==="TEXTAREA") return;  // ne pas écraser une saisie longue en cours
  $("#view").innerHTML = ({home:vHome, memos:vMemos, events:vEvents, lacher:vLacher, init:vInit, pl:vPL, evals:vEvals, simu:vSimu, valid:vValid, max:vMax, equipes:vEquipes, vols:vVols, dim:vDim, moi:vMoi, regles:vRegles}[ui.view]||vHome)();

function go(v){ ui.view=v; ui.form={}; try{localStorage.setItem("ftm.view",v);}catch(e){} render(); window.scrollTo(0,0); }
$("#back").addEventListener("click", ()=>go("home"));

const V = $("#view");
const val = id => (document.getElementById(id)||{}).value;
V.addEventListener("click", async e=>{
  const t = e.target.closest("button"); if (!t) return; const d = t.dataset;
  if (d.go) return go(d.go);
  if (d.fset) { ui.f[d.fset]=d.val; return render(); }
  if (d.openform) { ui.form[d.openform]=true; return render(); }
  if (d.closeform) { delete ui.form[d.closeform]; return render(); }
  // évals
  if (d.pick) { const o = st.opl[d.pick]; ui.form[d.pick] = {tri: d.tri || triDispo(o)[0], date:""}; return render(); }
  if (d.done || d.del || d.rate) {
    const m = d.done||d.del||d.rate, o = st.opl[m]; let P = (o.programmes||[]).map(p=>({...p})); const p = P.find(x=>x.id===d.pid); if (!p) return;
    if (d.del) return upd("opl/"+m, {programmes:P.filter(x=>x.id!==d.pid)}, "Vol retiré");
    if (d.rate) { p.statut="raté"; p.cause=val("cause-"+p.id); delete ui.form["r"+p.id]; return upd("opl/"+m, {programmes:P}, "Vol raté enregistré : "+causeLabel(p.cause)); }
    p.statut="fait"; const ex = [...(o.exclus||[])]; if (!ex.some(x=>norm(x)===norm(p.tri))) ex.push(p.tri);
    return upd("opl/"+m, {programmes:P, exclus:ex, evalsRestantes:Math.max(0,(o.evalsRestantes||0)-1)}, "Vol d'éval enregistré");
  }
  if (d.simuplus) { const o = st.opl[d.simuplus]; return upd("opl/"+d.simuplus, {simuFaits:(o.simuFaits||0)+1}, "Simu comptée"); }
  if (d.toeval) return upd("opl/"+d.toeval, {evalsRestantes:R().evalsStd, total:R().evalsStd, groupe:"OPL", priorite:"mois", echeance:addDays(T0,30)}, "Passé en évaluations");
  if (d.tochecks) return upd("opl/"+d.tochecks, {checkLocal:"En attente", checkNav:"En attente"}, "Passé en checks");
  // simu
  if (d.slot) { ui.form.slot=d.slot; return render(); }
  if (d.settri) { const [m,ji,si] = d.settri.split("|"); const s = st.simu[m].jours[ji].slots[si]; delete ui.form.slot;
    return setSlot(m,+ji,+si,{instr:d.val}, `${dayLabel(st.simu[m].jours[ji].date)} S${s.s} : TRI ${s.instr||"(vide)"} → ${d.val}`); }
  if (d.swap) { const [m,ji,si] = d.swap.split("|"), [m2,ji2,si2] = d.with.split("|");
    const J = JSON.parse(JSON.stringify(st.simu[m].jours)), a = J[ji].slots[si];
    const J2 = m2===m ? J : JSON.parse(JSON.stringify(st.simu[m2].jours)), b = J2[ji2].slots[si2];
    const ai = a.instr, bi = b.instr; a.instr = bi; b.instr = ai; delete ui.form.slot;
    await upd("simu/"+m, {jours:J}); if (m2!==m) await upd("simu/"+m2, {jours:J2});
    return add("simulog", {date:T0, texte:`Permutation : ${dayLabel(J[ji].date)} S${a.s} → ${bi} ; ${dayLabel(J2[ji2].date)} S${b.s} → ${ai}`, notifie:false, cree:Date.now()}, "Permutation faite"); }
  if (d.delslot) { const [m,ji,si] = d.delslot.split("|"); const j = st.simu[m].jours[ji], s = j.slots[si]; delete ui.form.slot;
    return setSlot(m,+ji,+si,null, `${dayLabel(j.date)} S${s.s} : séance supprimée (${s.instr||"sans TRI"} · ${s.crew||""})`); }
  if (d.copy) { const txt = $("#koubaMsg").textContent; try { await navigator.clipboard.writeText(txt); toast("Mail copié"); } catch(err){ const r = document.createRange(); r.selectNodeContents($("#koubaMsg")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Texte sélectionné : copie-le"); } return; }
  if (d.notified) { const ids = Object.entries(st.simulog).filter(([,l])=>!l.notifie).map(([id])=>id); for (const id of ids) await upd("simulog/"+id, {notifie:true, notifieLe:T0}); return toast("Notifié au CSV Kouba"); }
  // lâcher
  if (d.lq) { const p = st.instr[d.lq], cl = Object.assign({requis:2,faits:0}, p.cl||{});
    if (d.act==="pre") return upd("instr/"+d.lq, {preControle: p.preControle?"":T0}, p.preControle?"Pré-contrôle annulé":"Pré-contrôle enregistré");
    if (d.act==="clreq") return upd("instr/"+d.lq, {cl:{...cl, requis: cl.requis===2?4:2}});
    if (d.act==="cl") return upd("instr/"+d.lq, {cl:{...cl, faits: Math.min(cl.requis, cl.faits+1)}}, "Étape CL enregistrée");
    if (d.act==="lache") { await upd("instr/"+d.lq, {lache:T0}); return add("init", {nom:p.nom, pos:p.pos||"", heures:0, lacheLe:T0}, `${p.nom} lâché, ajouté en initiation`); } }
  if (d.delvol) { const p = st.instr[d.delvol]; return upd("instr/"+d.delvol, {vols:(p.vols||[]).filter(v=>v.id!==d.vid)}, "Vol retiré"); }
  if (d.dellacher) return del("instr/"+d.dellacher, "Pilote retiré");
  if (d.delinit) return del("init/"+d.delinit, "Retiré de l'initiation");
  // validités, max, mémos, événements
  if (d.cell) { ui.form.cell = d.cell; return render(); }
  if (d.delvalid) return del("valid/"+d.delvalid, "Pilote retiré");
  if (d.delmax) return del("max/"+d.delmax, "Pilote retiré");
  if (d.delmemo) return del("memos/"+d.delmemo, "Mémo supprimé");
  if (d.delev) return del("events/"+d.delev, "Événement supprimé");
  if (d.delobj) { const e2 = st.events[d.delobj]; return upd("events/"+d.delobj, {objectifs:(e2.objectifs||[]).filter(o=>o.id!==d.oid)}); }
  if (d.lic) { const Rw = lics().map(r=>({...r})); Rw[+d.lic].fait=!Rw[+d.lic].fait; return upd("ref/licences", {rows:Rw}, Rw[+d.lic].fait?"Licence renouvelée":"Annulé"); }
  if (d.moiplus || d.moimoins) { const k = d.moiplus||d.moimoins, p = Object.assign({fait:{},mois:T0.slice(0,7)}, st.perso.moi||{}); const fait = p.mois===T0.slice(0,7)?{...p.fait}:{};
    fait[k] = Math.max(0,(fait[k]||0) + (d.moiplus?1:-1)); return put("perso/moi", {...p, fait, mois:T0.slice(0,7)}); }
  if (d.vtypes) { const types = val("vtypes").split(",").map(s=>s.trim()).filter(Boolean); return put("ref/regles", {...(st.ref.regles||{}), validTypes:types}, "Types enregistrés"); }
});

  if (d.regle) put("ref/regles", {...(st.ref.regles||{}), [d.regle]:+t.value||0}, "Règle enregistrée");
  if (d.moiobj) { const p = Object.assign({objectifs:{}}, st.perso.moi||{}); put("perso/moi", {...p, objectifs:{...p.objectifs, [d.moiobj]:+t.value||0}}); }
  if (d.moitxt) { const p = Object.assign({}, st.perso.moi||{}); put("perso/moi", {...p, [d.moitxt]:t.value}, "Enregistré"); }
});
V.addEventListener("input", e=>{ const id = e.target.id; if (["vQ","eqQ","volQ"].includes(id)) { ui.f[id]=e.target.value; render(); } });
V.addEventListener("submit", async e=>{
  e.preventDefault(); const f = e.target, k = f.dataset.form;
  if (k==="memo") { const txt = val("mTxt").trim(); if (!txt) return; return add("memos", {texte:txt, echeance:val("mDate")||"", source:val("mSrc"), horizon:val("mHor"), cat:val("mCat"), fait:false, cree:T0}, "Mémo ajouté"); }
  if (k==="event") return add("events", {nom:val("eNom").trim(), date:val("eDate"), objectifs:[]}, "Événement créé");
  if (k==="obj") { const id = f.dataset.eid, e2 = st.events[id]; return upd("events/"+id, {objectifs:[...(e2.objectifs||[]), {id:uid("o"), texte:val("o-"+id).trim(), date:val("od-"+id)||"", fait:false}]}, "Objectif ajouté"); }
  if (k==="prog") { const m = f.dataset.m, o = st.opl[m], tri = val("tri-"+m), date = val("date-"+m); if (!tri) return; delete ui.form[m];
    return upd("opl/"+m, {programmes:[...(o.programmes||[]), {id:uid("p"), tri, date, statut:"programmé"}]}, `Vol avec ${tri} programmé`); }
  if (k==="evnew") { const g = f.dataset.g, mat = val("enMat").trim(), fa = +val("enF")||0, tot = R().evalsStd;
    if (st.opl[mat]) return toast("Ce matricule existe déjà : modifie la fiche existante.");
    return put("opl/"+mat, {nom:val("enNom").trim(), matricule:mat, groupe:g, total:tot, evalsRestantes:Math.max(0,tot-fa), exclus:[], programmes:[], echeance:val("enD")||"", ordre:100+Object.keys(st.opl).length,
      motif: g==="CIBLE"?val("enMotif"):"", simuRequis: g==="CIBLE"?(+val("enS")||0):0, simuFaits:0, checkLocal:"Validé", checkNav:"Validé"}, "Pilote ajouté"); }
  if (k==="lacher") return add("instr", {nom:val("lNom").trim(), pos:val("lPos"), legsInit:+val("lLegs")||0, vols:[], preControle:"", cl:{requis:2,faits:0}, lache:""}, "Pilote ajouté");
  if (k==="vol") { const id = f.dataset.pid, p = st.instr[id]; delete ui.form["v"+id];
    return upd("instr/"+id, {vols:[...(p.vols||[]), {id:uid("v"), date:val("vd-"+id), instr:val("vi-"+id), vols:val("vv-"+id), legs:+val("vl-"+id)||2, safety:val("vs-"+id)||""}]}, "Vol enregistré"); }
  if (k==="init") return add("init", {nom:val("iNom").trim(), pos:val("iPos"), heures:+val("iH")||0, lacheLe:""}, "Ajouté en initiation");
  if (k==="pair") { const a = val("pA"), b = norm(val("pB")); const hit = Object.values(st.init).find(p=>surname(p.nom)===surname(b) && norm(p.nom)!==norm(a));
    return toast(hit ? `Interdit : ${a} et ${hit.nom} sont tous les deux en initiation.` : "OK : l'autre membre n'est pas en initiation."); }
  if (k==="slot") { const [m,ji,si] = f.dataset.key.split("|"); const s = st.simu[m].jours[ji].slots[si], ni = val("sl-i").trim(), nc = val("sl-c").trim(); delete ui.form.slot;
    const ch = []; if (ni!==(s.instr||"")) ch.push(`TRI ${s.instr||"(vide)"} → ${ni||"(vide)"}`); if (nc!==(s.crew||"")) ch.push(`équipage ${s.crew||"(vide)"} → ${nc||"(vide)"}`);
    if (!ch.length) return render(); return setSlot(m,+ji,+si,{instr:ni, crew:nc}, `${dayLabel(st.simu[m].jours[ji].date)} S${s.s} : ${ch.join(" ; ")}`); }
  if (k==="addslot") { const m = f.dataset.m, ji = +f.dataset.ji, sn = +val("as-s"); const J = JSON.parse(JSON.stringify(st.simu[m].jours));
    J[ji].slots.push({s:sn, h:SLOTS[sn-1], instr:val("as-i").trim(), crew:val("as-c").trim()}); J[ji].slots.sort((a,b)=>a.s-b.s); delete ui.form["add"+m+ji];
    await upd("simu/"+m, {jours:J}); return add("simulog", {date:T0, texte:`${dayLabel(J[ji].date)} S${sn} : nouvelle séance (${val("as-i")||"sans TRI"} · ${val("as-c")})`, notifie:false, cree:Date.now()}, "Séance ajoutée"); }
  if (k==="valid") return add("valid", {nom:val("vaNom").trim(), fonction:val("vaFn"), items:{}}, "Pilote ajouté");
  if (k==="cell") { const [id,type] = f.dataset.key.split("|"); const p = st.valid[id]; delete ui.form.cell; return upd("valid/"+id, {items:{...(p.items||{}), [type]:val("ce")}}, "Date enregistrée"); }
  if (k==="max") return add("max", {nom:val("xNom").trim(), pos:val("xPos"), etape:val("xEt"), licenceOk:false, suiviInforme:false, progInforme:false}, "Pilote ajouté");
});

render();
(async function boot(){
  const db = window.claude && await window.claude.use("db");
  if (!db) { st.dbFailed = true; return render(); }
  st.db = db;
  COLS.forEach(name => db.collection(name).onSnapshot(s=>{ st[name]={}; s.docs.forEach(x=>st[name][x.id]=x.data()); st.loaded[name]=true; render(); }, ()=>{ st.loaded[name]=true; render(); }));
})();
})();
</script>
